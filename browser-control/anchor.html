<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Muniment browser control</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f5f2ea; color: #252825; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; margin-bottom: 24px; border: 1px solid currentColor; border-radius: 50%; font: 600 20px/1 Georgia, serif; }
      .eyebrow { margin: 0 0 10px; color: #65706a; font: 600 12px/1.4 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 16px; font: 500 clamp(28px, 5vw, 38px)/1.15 Georgia, serif; letter-spacing: -.02em; }
      #status { margin: 0 auto; max-width: 48ch; color: #4d544f; font-size: 16px; line-height: 1.65; }
      body[data-state="connected"] .eyebrow { color: #28685d; }
      @media (prefers-color-scheme: dark) {
        :root { background: #181b19; color: #ece9e1; }
        .eyebrow, #status { color: #adb5af; }
        body[data-state="connected"] .eyebrow { color: #70b7a7; }
      }
    </style>
  </head>
  <body data-state="disconnected">
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">M</div>
      <p class="eyebrow" id="state-label">Disconnected</p>
      <h1>Muniment browser control</h1>
      <p id="status">Browser control disconnected. Reconnect from the Muniment desktop app.</p>
    </main>
    <script src="anchor.js"></script>
  </body>
</html>
