# The AI factory's contract for the muniment desktop. The factory reads it from
# the default branch, and only a human commit changes anything under .factory/.
version: 1
forge: forgejo
default_branch: main
language: rust

# The agent rules are the owner's, and the secret-scan config judges every change.
protected:
  - "AGENTS.md"
  - "CLAUDE.md"
  - ".gitleaks.toml"

# Packaging, signing, the desktop-ci and release tooling, and the runtime
# boundary decide what reaches an installed app.
risk_paths:
  - "src-tauri/tauri*.conf.json"
  - "src-tauri/windows/**"
  - "src-tauri/packaging/**"
  - "src-tauri/capabilities/**"
  - ".github/build-*"
  - ".github/lib/**"
  - ".github/actions/**"
  - ".github/desktop-ci-command.py"
  - "scripts/update-muniment-core.sh"
  - "SPEC.md"
  - "DESIGN.md"

gates:
  build:
    commands: ["npm run build"]
    timeout_s: 900
  lint:
    commands:
      - "bash scripts/check-steering.sh ."
      - "node test/ui-copy-lint.mjs src src-tauri browser-control"
    timeout_s: 600
  # The sandbox has no GTK, WebKit, browser, rustfmt, clippy or desktop-ci
  # access. The gate runs the main vitest suite, the CI routing tests, the
  # browser-control relay core tests, the Go reader tests and the tests of the
  # Rust crates that build without Tauri. The
  # image's CARGO_HOME is read-only, so cargo uses one under HOME, where setup
  # fetches the locked crates and the muniment-core checkout that the frontend
  # suite reads. One vitest retry absorbs a render wait that a busy sandbox
  # outlasts. CI runs the browser suite, the Rust checks of the Tauri crate and
  # the three-platform compile preflight on every pull request.
  unit_tests:
    commands:
      - "CARGO_HOME=$HOME/.cargo npx vitest run --root . --exclude 'test/e2e/**' --exclude 'prototypes/**' --exclude 'browser-control/**' --exclude '**/*.browser.test.js' --retry=1"
      - "node --test test/ci-routing.node.mjs"
      - "npm run browser-control"
      - "cd src-tauri/reader && go test ./..."
      - >-
        CARGO_HOME=$HOME/.cargo cargo test --manifest-path src-tauri/Cargo.toml --locked
        --package muniment-desktop-integration --package muniment-cli --package muniment-acp
        --package muniment-runtime --features muniment-desktop-integration/keyring
        -- --test-threads=1
    timeout_s: 3600
  # Set explicitly, so a change of the contract defaults leaves these gates as they are.
  complexity:
    enabled: false
  dependencies:
    enabled: false
  mutation:
    enabled: false
  acceptance:
    enabled: false
  ci:
    provider: forgejo
    # Empty: every reported check counts and a skipped one passes. The always
    # reported checks are `CI / changes (pull_request)`, `CI / checks (pull_request)`,
    # `CI / smoke (pull_request)` and `secret-scan / gitleaks (pull_request)`.
    # `CI / Desktop compile preflight (<platform>) (pull_request)` reports when
    # desktop code changes and then gates the merge as well.
    required: []
    # The desktop matrix queues behind the shared desktop-ci slot on pve01.
    timeout_s: 14400

budgets:
  run_wall_s: 2700
  gate_rounds: 3
  review_rounds: 1
  # Two long CI runs never compete for the desktop-ci slot.
  concurrent_runs: 1

sandbox:
  cpus: 4
  memory_mib: 8192
  # crates.io for the locked crates, and GitHub for the muniment-core git dependency.
  egress:
    - "registry.npmjs.org:443"
    - "index.crates.io:443"
    - "static.crates.io:443"
    - "github.com:443"
  setup:
    - "for n in 1 2 3; do npm ci --no-audit --no-fund --fetch-retries=5 && exit 0; sleep 20; done; exit 1"
    - "for n in 1 2 3; do CARGO_HOME=$HOME/.cargo cargo fetch --locked --manifest-path src-tauri/Cargo.toml && exit 0; sleep 20; done; exit 1"
    - "for n in 1 2 3; do npm ci --prefix browser-control --no-audit --no-fund --fetch-retries=5 && exit 0; sleep 20; done; exit 1"

# Releases are owner-gated workflow_dispatch runs, so a merge ships nothing.
verify:
  commands:
    - "npm run build"
  timeout_s: 900

# The owner files every task: no automatic cleanup task.
cleanup:
  enabled: false
