# The AI factory's contract for the muniment desktop at the root and the core
# workspace under core/. The factory reads it from the default branch, and only
# a human commit changes anything under .factory/.
version: 1
forge: forgejo
default_branch: main
language: rust

# The agent rules are the owner's, and the secret-scan config judges every change.
# Core's CI and pins update live in .forgejo/workflows/core*.yml.
protected:
  - "AGENTS.md"
  - "CLAUDE.md"
  - "core/AGENTS.md"
  - "core/CLAUDE.md"
  - ".gitleaks.toml"
  - ".forgejo/workflows/core*.yml"

# Packaging, signing, the desktop-ci and release tooling, and the runtime
# boundary decide what reaches an installed app.
risk_paths:
  - "src-tauri/tauri*.conf.json"
  - "src-tauri/windows/**"
  - "src-tauri/packaging/**"
  - "src-tauri/capabilities/**"
  - ".github/build-*"
  - ".github/lib/**"
  - ".github/actions/**"
  - ".github/desktop-ci-command.py"
  - "SPEC.md"
  - "DESIGN.md"
  # A release ships the core to the desktop, the router and the sandbox
  # image. The pins, the release tooling, the router image and the public
  # boundary decide what they get.
  - "core/pins/**"
  - "core/scripts/release.py"
  - "core/scripts/pins/**"
  - "core/scripts/check-core-boundary.*"
  - "core/deploy/**"
  - "core/docs/core-boundary.md"
  - "core/crates/pins/**"
  - "core/crates/router/src/server.rs"
  - "core/crates/router/src/store.rs"
  - "core/Cargo.toml"

# The core commands run in core/. Its toolchain needs rustfmt and clippy, which
# the image lacks, and the image's RUSTUP_HOME and CARGO_HOME are read-only, so
# setup copies the toolchain under HOME, adds both components, and fetches the
# locked crates into a CARGO_HOME under HOME. Every core command sets both
# variables.
gates:
  build:
    commands:
      - "npm run build"
      - "cd core && RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo build --workspace --all-targets --locked --features muniment-pins/cli"
    timeout_s: 3300
  # The lint gate runs the repository checks of CI's checks and smoke jobs,
  # formats and lints the core workspace and the src-tauri crates that build
  # without Tauri, and formats and vets the Go reader. The Tauri crate needs
  # the CEF download, so CI's desktop preflight lints it.
  lint:
    commands:
      - "bash scripts/check-steering.sh ."
      - "node test/ui-copy-lint.mjs src src-tauri browser-control"
      - "bash scripts/check-private-addresses.sh"
      - "python3 -B scripts/version.py check"
      - "CARGO_HOME=$HOME/.cargo bash test/smoke.sh"
      - "CARGO_HOME=$HOME/.cargo bash test/cli-dependency-boundary.sh"
      - "CARGO_HOME=$HOME/.cargo bash test/runtime-dependency-boundary.sh"
      - "RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo fmt --manifest-path src-tauri/Cargo.toml --all --check"
      - >-
        RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo clippy --manifest-path src-tauri/Cargo.toml
        --package muniment-desktop-integration --package muniment-acp --package muniment-cli
        --package muniment-runtime --all-targets --locked -- -D warnings
      - 'cd src-tauri/reader && test -z "$(gofmt -l .)" && go vet ./...'
      - "cd core && RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo fmt --all --check"
      - "cd core && RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo clippy --workspace --all-targets --locked --features muniment-pins/cli -- -D warnings"
      - "cd core && RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo clippy -p muniment-router --all-targets --features server --locked -- -D warnings"
      # The core boundary check runs the port tests. One test thread keeps the
      # router's timing tests stable on the sandbox's four CPUs. /tmp is the
      # sandbox's tmpfs, as /ci-tmpfs is CI's: the attach tests bind Unix
      # sockets under TMPDIR, and the image's own TMPDIR is too long for one.
      - "cd core && TMPDIR=/tmp RUST_TEST_THREADS=1 RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo scripts/check-core-boundary.sh"
    timeout_s: 5400
  # The sandbox has no GTK, WebKit, browser, rustfmt, clippy or desktop-ci
  # access. The gate runs the main vitest suite, the CI routing tests, the
  # browser-control relay core tests, the Go reader tests and the tests of the
  # Rust crates that build without Tauri. The
  # image's CARGO_HOME is read-only, so cargo uses one under HOME, where setup
  # fetches the locked crates. The frontend suite reads core/ in the checkout.
  # One vitest retry absorbs a render wait that a busy sandbox outlasts. CI
  # runs the browser suite, the Rust checks of the Tauri crate and the
  # three-platform compile preflight on every pull request. The core tests
  # skip the network tests, which download Pi, and the router's Postgres
  # tests. Core CI runs both, the macOS tests, the Windows checks and the
  # router image build.
  unit_tests:
    commands:
      - "CARGO_HOME=$HOME/.cargo npx vitest run --root . --exclude 'test/e2e/**' --exclude 'prototypes/**' --exclude 'browser-control/**' --exclude '**/*.browser.test.js' --retry=1"
      - "node --test test/ci-routing.node.mjs"
      - "node --test test/subscription-acceptance.node.mjs"
      - "python3 -B scripts/test_check_steering.py && python3 -B scripts/test_private_addresses.py && python3 -B scripts/test_version.py"
      - "npm run browser-control"
      - "cd src-tauri/reader && go test ./..."
      # The sandbox kernel has no inet_diag, so the test that reads real socket
      # owners through NETLINK_SOCK_DIAG runs only in CI.
      - >-
        TMPDIR=/tmp CARGO_HOME=$HOME/.cargo cargo test --manifest-path src-tauri/Cargo.toml --locked
        --package muniment-desktop-integration --package muniment-cli --package muniment-acp
        --package muniment-runtime --features muniment-desktop-integration/keyring
        -- --test-threads=1 --skip real_diagnostic_selects_the_browser_client_half
      - "cd core && TMPDIR=/tmp RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo test --workspace --locked --features muniment-pins/cli -- --test-threads=1"
      - "cd core && python3 -B scripts/test_release.py"
      - "cd core && python3 -B scripts/pins/test_update.py"
      - "cd core && python3 -B scripts/test_desktop_ci.py"
    timeout_s: 7200
  # Set explicitly, so a change of the contract defaults leaves these gates as they are.
  complexity:
    enabled: false
  dependencies:
    enabled: false
  mutation:
    enabled: false
  acceptance:
    enabled: false
  ci:
    provider: forgejo
    # Empty: every reported check counts and a skipped one passes. The always
    # reported checks are `CI / changes (pull_request)`, `CI / checks (pull_request)`,
    # `CI / smoke (pull_request)` and `secret-scan / gitleaks (pull_request)`.
    # `CI / Desktop compile preflight (<platform>) (pull_request)` reports when
    # desktop code changes and then gates the merge as well.
    required: []
    # The desktop matrix and the core macOS and Windows jobs queue behind the
  # shared desktop-ci slot.
    timeout_s: 14400

budgets:
  # Two sandboxes, so a gate run lands beside a long implement run. CI runs
  # queue on the shared desktop-ci slot, and the lane serves every other
  # task in turn, so no more than two.
  concurrent_runs: 2

sandbox:
  # The factory's desktop lane image holds the locked crates, the npm cache and
  # a warm build of the Rust test crates, so setup and the Rust tests reuse them.
  lane: desktop
  cpus: 4
  memory_mib: 8192
  # npm, crates.io for the locked crates, GitHub release downloads for the
  # sherpa-onnx libraries, and the Rust dist server for rustfmt and clippy.
  egress:
    - "registry.npmjs.org:443"
    - "index.crates.io:443"
    - "static.crates.io:443"
    - "github.com:443"
    - "objects.githubusercontent.com:443"
    - "release-assets.githubusercontent.com:443"
    - "static.rust-lang.org:443"
  # The core sherpa-onnx build script downloads its libraries with bundled TLS
  # roots, which reject the sandbox egress proxy, so setup fetches the archive
  # with curl and points the build script at it through the CARGO_HOME config.
  # The sandbox's writable layer is small, so the same config drops debug info
  # and incremental builds. Each setup step skips what is already in place, so
  # setup also runs on an image that ships its result.
  setup:
    - "for n in 1 2 3; do npm ci --no-audit --no-fund --fetch-retries=5 && exit 0; sleep 20; done; exit 1"
    - "for n in 1 2 3; do CARGO_HOME=$HOME/.cargo cargo fetch --locked --manifest-path src-tauri/Cargo.toml && exit 0; sleep 20; done; exit 1"
    - "for n in 1 2 3; do npm ci --prefix browser-control --no-audit --no-fund --fetch-retries=5 && exit 0; sleep 20; done; exit 1"
    - "cd core && { test -f $HOME/.rustup/.copied || { rm -rf $HOME/.rustup && cp -R /opt/rust/rustup $HOME/.rustup && touch $HOME/.rustup/.copied; }; }"
    - >-
      cd core &&
      if RUSTUP_HOME=$HOME/.rustup cargo fmt --version >/dev/null 2>&1 &&
      RUSTUP_HOME=$HOME/.rustup cargo clippy --version >/dev/null 2>&1; then exit 0; fi;
      for n in 1 2 3; do RUSTUP_HOME=$HOME/.rustup rustup component add rustfmt clippy && exit 0; sleep 20; done; exit 1
    - "cd core && for n in 1 2 3; do RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo fetch --locked && exit 0; sleep 20; done; exit 1"
    - >-
      cd core &&
      v=$(grep -A1 '^name = "sherpa-onnx-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p') &&
      f=sherpa-onnx-v$v-linux-x64-shared-lib.tar.bz2 && mkdir -p $HOME/sherpa-onnx &&
      { test -s $HOME/sherpa-onnx/$f ||
      curl -fsSL --retry 3 -o $HOME/sherpa-onnx/$f https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$f; }
    - >-
      cd core &&
      { grep -qs SHERPA_ONNX_ARCHIVE_DIR $HOME/.cargo/config.toml ||
      printf '[build]\nincremental = false\n[profile.dev]\ndebug = 0\n[env]\nSHERPA_ONNX_ARCHIVE_DIR = "%s/sherpa-onnx"\n' "$HOME"
      >> $HOME/.cargo/config.toml; }

# Releases are owner-gated workflow_dispatch runs that ship the desktop and the
# core under one tag, so verify builds the core workspace.
verify:
  commands:
    - "npm run build"
    - "cd core && RUSTUP_HOME=$HOME/.rustup CARGO_HOME=$HOME/.cargo cargo build --workspace --locked"
  timeout_s: 3300

# The owner files every task: no automatic cleanup task.
cleanup:
  enabled: false
