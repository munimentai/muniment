name: Nightly desktop release

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build (targeted re-runs). Non-'all' skips publish."
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: write

concurrency:
  group: nightly-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: self-hosted
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve main revision
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "main",
            });
            core.setOutput("sha", data.sha);

      - name: Ensure rolling pre-release exists
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: "nightly" });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: "nightly",
                target_commitish: process.env.SOURCE_SHA,
                name: "Nightly desktop build",
                body: "Initial nightly build is in progress.",
                prerelease: true,
              });
            }

  build:
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Full matrix on schedule / platform=all; a single platform on a targeted dispatch.
        platform: ${{ fromJSON((github.event.inputs.platform == '' || github.event.inputs.platform == 'all') && '["linux","windows","macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - name: Build and upload (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          # Azure Artifact Signing (Windows). Empty until the six repo secrets
          # exist => unsigned build. TENANT/CLIENT/SECRET authenticate the
          # service principal; ENDPOINT/ACCOUNT/PROFILE address the cert profile.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          # Apple Developer ID signing + notarization (macOS). Empty until the
          # six repo secrets exist => unsigned build. CERTIFICATE/PASSWORD import
          # the Developer ID Application cert; API_KEY/API_KEY_ID/API_ISSUER
          # authenticate notarytool; TEAM_ID identifies the account. Enrollment
          # Y5DUNHQA74 is in review; fill the vault keys the day it clears.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -u
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          build='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev && npm ci --no-audit --no-fund && bash .github/build-linux.sh'
          if [ "$PLATFORM" = "windows" ]; then
            build='npm ci --no-audit --no-fund && node .github/build-windows-installers.mjs && powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/windows-installers.ps1'
          fi
          if [ "$PLATFORM" = "macos" ]; then
            build='npm ci --no-audit --no-fund && rustup target add aarch64-apple-darwin && node .github/build-macos-app.mjs'
          fi

          # The VM is destroyed when desktop-ci exits, so completed bundles are
          # uploaded from inside it. desktop-ci does a shallow clone of main's
          # tip; fetch the pinned commit BY HASH before checkout so all three
          # serialized platforms build the exact same source even when main
          # advances mid-run (a shallow branch clone can't check out a commit
          # that is no longer the tip -> "unable to read tree", macOS built last
          # so hit it most).
          cmd="git fetch --depth 1 origin $SOURCE_SHA && git checkout --detach $SOURCE_SHA && $build && node .github/upload-nightly-assets.mjs $REPOSITORY $SOURCE_SHA $PLATFORM"
          repo_url="https://github.com/${REPOSITORY}.git"
          ssh_cmd="sudo desktop-ci $PLATFORM --repo '$repo_url' --ref 'main' --cmd '$cmd'"

          # Windows code signing: when the Azure Artifact Signing secrets exist,
          # hand the service-principal creds to desktop-ci on stdin (never argv,
          # so they stay out of pve01's sudo log and process list) and it injects
          # them into the ephemeral build VM. Absent secret => unchanged unsigned build.
          if [ "$PLATFORM" = "windows" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            signing_env=$(printf '%s\n' \
              "AZURE_TENANT_ID=$AZURE_TENANT_ID" \
              "AZURE_CLIENT_ID=$AZURE_CLIENT_ID" \
              "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET" \
              "AZURE_SIGNING_ENDPOINT=$AZURE_SIGNING_ENDPOINT" \
              "AZURE_SIGNING_ACCOUNT=$AZURE_SIGNING_ACCOUNT" \
              "AZURE_SIGNING_PROFILE=$AZURE_SIGNING_PROFILE")
          fi
          # macOS Developer ID signing: same seam. The .p12 and .p8 arrive
          # base64-encoded (single-line, so they survive the KEY=VALUE contract);
          # build-macos-app.mjs decodes them. Absent cert => unchanged unsigned build.
          if [ "$PLATFORM" = "macos" ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            signing_env=$(printf '%s\n' \
              "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" \
              "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" \
              "APPLE_TEAM_ID=$APPLE_TEAM_ID" \
              "APPLE_API_KEY=$APPLE_API_KEY" \
              "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" \
              "APPLE_API_ISSUER=$APPLE_API_ISSUER")
          fi
          { printf '%s\n' "GH_TOKEN=$REPO_TOKEN"; if [ -n "${signing_env:-}" ]; then printf '%s\n' "$signing_env"; fi; } \
          | ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
                desktopci@10.1.10.10 "$ssh_cmd --env-stdin"

  publish:
    needs: [prepare, build]
    # Skip on a single-platform targeted run — the release asset-set check needs all platforms.
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all'
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      WINDOWS_SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Finalize rolling pre-release
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            const prefix = `nightly-${sha}-`;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: "nightly",
            });
            const expected = [
              [".deb"],
              [".AppImage"],
              [".msi", "-machine.msi"],
              ["-machine.msi"],
              ["-nsis.exe"],
              [".app.zip"],
            ];
            for (const [suffix, excludeSuffix] of expected) {
              const matches = release.assets.filter((asset) =>
                asset.name.startsWith(prefix) && asset.name.endsWith(suffix) &&
                (!excludeSuffix || !asset.name.endsWith(excludeSuffix)));
              if (matches.length !== 1) {
                core.setFailed(`expected one ${suffix} asset for ${sha}, found ${matches.length}`);
                return;
              }
            }
            for (const asset of release.assets) {
              if (!asset.name.startsWith(prefix)) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id,
                });
              }
            }
            const buildDate = new Date().toISOString().replace("T", " ").replace(/:\d\d\.\d\d\dZ$/, " UTC");
            const signing = process.env.WINDOWS_SIGNING_ENABLED === "true"
              ? `\n\nWindows installers for \`${sha}\` were signed by the nightly workflow.`
              : "\n\nWindows installers are unsigned; stable promotion is blocked.";
            const macSigning = process.env.MACOS_SIGNING_ENABLED === "true"
              ? `\n\nmacOS app for \`${sha}\` was signed and notarized by the nightly workflow.`
              : "\n\nmacOS app is unsigned pending Apple credentials.";
            // Keep the rolling tag at its original commit. GitHub blocks
            // GITHUB_TOKEN when a commit range changes workflow files.
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              name: "Nightly desktop build",
              body: `Automated desktop build from \`${sha}\`.\n\nBuilt ${buildDate}.${signing}${macSigning}\n\nModel weights are not included.`,
              prerelease: true,
            });

  linux-e2e:
    needs: [prepare, build, publish]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'linux' && needs.publish.result == 'skipped'))
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TOKEN: ${{ github.token }}
      FIXTURE_USERNAME: ${{ secrets.DESKTOP_E2E_USERNAME }}
      FIXTURE_PASSWORD: ${{ secrets.DESKTOP_E2E_PASSWORD }}
    steps:
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Validate targeted Linux pre-release asset
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'linux'
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: "nightly",
            });
            const assetName = `nightly-${sha}-linux-muniment.deb`;
            if (release.assets.filter((asset) => asset.name === assetName).length !== 1) {
              core.setFailed(`expected one ${assetName} asset before Linux E2E`);
              return;
            }

      - name: Run installed Linux sign-in via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output"' EXIT

          cmd='bash test/e2e/runner/linux.sh'
          remote="sudo desktop-ci linux --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts"
          set +e
          printf '%s\n' \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
            "MUNIMENT_E2E_USERNAME=$FIXTURE_USERNAME" \
            "MUNIMENT_E2E_PASSWORD=$FIXTURE_PASSWORD" \
          | ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          # Require the contract's one exact, ordered marker pair, strict base64,
          # and a regular-file/directory-only archive before extracting.
          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-e2e-artifacts" "$run_status" || extract_status=$?
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-e2e-artifacts" installed-linux "$run_status" "$extract_status"
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - name: Upload successful diagnostics
        if: always() && steps.e2e.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-${{ needs.prepare.outputs.source_sha }}-success
          path: ${{ runner.temp }}/muniment-e2e-artifacts
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: always() && steps.e2e.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-${{ needs.prepare.outputs.source_sha }}-failure
          path: ${{ runner.temp }}/muniment-e2e-artifacts
          retention-days: 30
          if-no-files-found: error

      - name: Upload stable JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-report
          path: ${{ runner.temp }}/muniment-e2e-artifacts/junit-*.xml
          retention-days: 30
          if-no-files-found: error

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  windows-e2e:
    needs: [prepare, linux-e2e]
    # The shared real-auth fixture is exclusive: Windows starts only after the
    # Linux case has completely finished, including its finalizer.
    if: >-
      always() && needs.prepare.result == 'success' && needs.linux-e2e.result != 'skipped' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all')
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TOKEN: ${{ github.token }}
      FIXTURE_USERNAME: ${{ secrets.DESKTOP_E2E_USERNAME }}
      FIXTURE_PASSWORD: ${{ secrets.DESKTOP_E2E_PASSWORD }}
    steps:
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Run installed Windows sign-in via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output"' EXIT

          cmd='powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/e2e/runner/windows.ps1'
          remote="sudo desktop-ci windows --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts"
          set +e
          printf '%s\n' \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
            "MUNIMENT_E2E_USERNAME=$FIXTURE_USERNAME" \
            "MUNIMENT_E2E_PASSWORD=$FIXTURE_PASSWORD" \
          | ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-windows-e2e-artifacts" "$run_status" || extract_status=$?
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-windows-e2e-artifacts" installed-windows "$run_status" "$extract_status"
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - name: Upload successful diagnostics
        if: always() && steps.e2e.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ needs.prepare.outputs.source_sha }}-success
          path: ${{ runner.temp }}/muniment-windows-e2e-artifacts
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: always() && steps.e2e.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ needs.prepare.outputs.source_sha }}-failure
          path: ${{ runner.temp }}/muniment-windows-e2e-artifacts
          retention-days: 30
          if-no-files-found: error

      - name: Upload stable JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-report
          path: ${{ runner.temp }}/muniment-windows-e2e-artifacts/junit-*.xml
          retention-days: 30
          if-no-files-found: error

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  macos-e2e:
    needs: [prepare, windows-e2e]
    # pve01 permits one desktop VM at a time. macOS starts only after the
    # Windows case has completely finished, including its finalizer.
    if: >-
      always() && needs.prepare.result == 'success' && needs.windows-e2e.result != 'skipped' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all')
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TOKEN: ${{ github.token }}
    steps:
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Run installed macOS launch smoke via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output"' EXIT

          cmd='bash test/e2e/runner/macos.sh'
          remote="sudo desktop-ci macos --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts --screendump"
          set +e
          printf '%s\n' \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
          | ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-macos-e2e-artifacts" "$run_status" || extract_status=$?
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-macos-e2e-artifacts" installed-macos "$run_status" "$extract_status" 1
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - name: Upload successful diagnostics
        if: always() && steps.e2e.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-${{ needs.prepare.outputs.source_sha }}-success
          path: ${{ runner.temp }}/muniment-macos-e2e-artifacts
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: always() && steps.e2e.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-${{ needs.prepare.outputs.source_sha }}-failure
          path: ${{ runner.temp }}/muniment-macos-e2e-artifacts
          retention-days: 30
          if-no-files-found: error

      - name: Upload stable JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-report
          path: ${{ runner.temp }}/muniment-macos-e2e-artifacts/junit-*.xml
          retention-days: 30
          if-no-files-found: error

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  report-e2e-failure:
    needs: [prepare, linux-e2e, windows-e2e, macos-e2e]
    if: >-
      always() && (needs.linux-e2e.result == 'failure' ||
      needs.windows-e2e.result == 'failure' || needs.macos-e2e.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update installed-E2E triage issue
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          LINUX_RESULT: ${{ needs.linux-e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows-e2e.result }}
          MACOS_RESULT: ${{ needs.macos-e2e.result }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed("cannot report installed-E2E failure without a valid pinned source SHA");
              return;
            }

            const platforms = [
              ["Linux", process.env.LINUX_RESULT],
              ["Windows", process.env.WINDOWS_RESULT],
              ["macOS", process.env.MACOS_RESULT],
            ].filter(([, result]) => result === "failure").map(([name]) => name);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[nightly-e2e] Installed test failure for ${sha}`;
            const body = [
              "The installed nightly desktop test failed and needs triage.",
              "",
              `- Pinned source SHA: \`${sha}\``,
              `- Failing platforms: ${platforms.join(", ")}`,
              `- Workflow run and artifacts: ${runUrl}`,
              "",
              "This report contains workflow metadata only. Review the redacted artifacts from the linked run for diagnostics.",
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Failure repeated.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
