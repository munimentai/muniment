name: MinIO artifact transport

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: muniment-checks
    timeout-minutes: 15
    concurrency:
      group: artifact-store-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the transport and workflows
        run: node --test test/artifact-store.node.mjs test/ci-routing.node.mjs

  # Keep the ARM transport probe on its native host.
  upload:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      attempt: ${{ steps.upload.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-artifact-store
      - name: Upload and read back the ARM fixtures with 64 MiB diagnostics
        id: upload
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        run: |
          test "$(uname -m)" = arm64
          node .github/lib/artifact-store-probe.mjs upload
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  collect:
    needs: upload
    runs-on: muniment-checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-artifact-store
      - name: Collect the exact run fixtures and verify 64 MiB uploads
        env:
          UPLOAD_ATTEMPT: ${{ needs.upload.outputs.attempt }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        run: node .github/lib/artifact-store-probe.mjs collect
