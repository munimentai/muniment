name: CI

# Desktop builds run through the pve01 desktop-ci driver (SSH-driven VM
# clones; see homelab docs/infra-notes.md "Desktop-CI GLUE built"). The
# runner container carries DESKTOP_CI_SSH_KEY, a restricted key whose only
# capability on pve01 is `sudo desktop-ci`. The driver runs two VM slots.
# The PR gate: `changes` classifies the diff in about a minute, then smoke
# (structure check + unit tests) and the three native compile preflights run
# in parallel off it. The three-platform desktop-build matrix runs only when
# the diff touches installer, packaging, workflow or e2e paths; the nightly
# builds and proves every merge on all three platforms. Markdown-only PRs
# also run the public core boundary.
# Push-to-main runs smoke only — merges are already PR-gated.
# NOTE: the driver clones `--branch <ref>`, so we pass the branch NAME (the
# PR head ref), which builds the branch TIP, not necessarily the triggering
# SHA — fine for the merge gate, do not use for release artifact provenance.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: self-hosted
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      companion: ${{ steps.changes.outputs.companion }}
      attach_fixtures: ${{ steps.changes.outputs.attach_fixtures }}
      code_diff_fixtures: ${{ steps.changes.outputs.code_diff_fixtures }}
      desktop: ${{ steps.changes.outputs.desktop }}
      installer: ${{ steps.changes.outputs.installer }}
      resident_model_adr: ${{ steps.changes.outputs.resident_model_adr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify PR changes
        if: github.event_name == 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=true
          companion=false
          attach_fixtures=false
          code_diff_fixtures=false
          desktop=false
          installer=false
          resident_model_adr=false
          while IFS= read -r path; do
            case "$path" in
              docs/decisions/0017-*.md)
                # Markdown, so this stays a docs-only PR for the native build
                # gates. But ADR 0017's pinned table is asserted field by field
                # against RESIDENT_MODEL by
                # src-tauri/core/tests/resident_model_adr.rs, and that guard is
                # worthless if it skips the case it exists for: the record
                # changing on its own.
                resident_model_adr=true
                ;;
              *.md) ;;
              src-tauri/cli/*|src-tauri/cli/**|src-tauri/runtime/*|src-tauri/runtime/**)
                docs_only=false
                companion=true
                ;;
              src-tauri/reader/*|src-tauri/reader/**)
                # The Go reader sidecar ships beside the runtime in every bundle.
                docs_only=false
                companion=true
                desktop=true
                ;;
              protocol-fixtures/code-diff/*|protocol-fixtures/code-diff/**)
                docs_only=false
                companion=true
                desktop=true
                code_diff_fixtures=true
                ;;
              protocol-fixtures/*|protocol-fixtures/**)
                docs_only=false
                companion=true
                attach_fixtures=true
                ;;
              src-tauri/attach/*|src-tauri/attach/**)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                ;;
              src-tauri/code-diff/*|src-tauri/code-diff/**)
                docs_only=false
                companion=true
                desktop=true
                code_diff_fixtures=true
                ;;
              src-tauri/acp/*|src-tauri/acp/**)
                docs_only=false
                companion=true
                ;;
              src-tauri/Cargo.toml|src-tauri/Cargo.lock)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                code_diff_fixtures=true
                ;;
              *)
                docs_only=false
                desktop=true
                ;;
            esac
            case "$path" in
              src-tauri/tauri*.conf.json|src-tauri/windows/*|src-tauri/packaging/*|src-tauri/capabilities/*|.github/build-*.mjs|.github/build-*.sh|.github/lib/*|.github/upload-nightly-assets.mjs|.github/workflows/ci.yml|test/e2e/*|test/windows-installers.ps1)
                # The installer, packaging, workflow and e2e paths are the ones
                # the nightly cannot prove one merge later without a red run,
                # so only these run the three-platform build on the PR.
                installer=true
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "companion=$companion" >> "$GITHUB_OUTPUT"
          echo "attach_fixtures=$attach_fixtures" >> "$GITHUB_OUTPUT"
          echo "code_diff_fixtures=$code_diff_fixtures" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "resident_model_adr=$resident_model_adr" >> "$GITHUB_OUTPUT"


  smoke:
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 24 (bootstrap if missing)
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: |
          node_dir="$HOME/.local/node-24"
          if { ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(`.`)[0]' 2>/dev/null)" != 24 ]; } \
              && [ ! -x "$node_dir/bin/node" ]; then
            case "$(uname -m)" in
              x86_64) node_arch=x64 ;;
              aarch64|arm64) node_arch=arm64 ;;
              *) printf 'unsupported Node architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
            esac
            mkdir -p "$node_dir"
            curl --proto '=https' --tlsv1.2 -sSfL \
              "https://nodejs.org/dist/v24.4.1/node-v24.4.1-linux-${node_arch}.tar.xz" \
              | tar -xJ --strip-components=1 -C "$node_dir"
          fi
          echo "$HOME/.local/node-24/bin" >> "$GITHUB_PATH"

      - name: Frontend unit tests
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Probe fixtures
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm run probe:check

      - name: UI copy law
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm run lint:copy

      - name: Record font law
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm run test:records

      - name: Provenance line law
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm run test:provenance

      - name: Browser control relay core
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm ci --prefix browser-control --no-audit --no-fund && npm run browser-control

      # Unit tests cover src-tauri/core (muniment-core), which is kept free of
      # Tauri on purpose: compiling the tauri crate needs the GUI dev stack
      # (webkit2gtk etc.) that only the desktop-ci build VMs carry, while the
      # core crate compiles anywhere. The runner container persists, so the
      # rustup bootstrap below is a one-time cost.
      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          # rustc needs a C linker even for dependency-free crates
          if ! command -v cc >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev
          fi

      - name: Structure smoke
        run: test/smoke.sh

      - name: Steering check
        run: scripts/check-steering.sh .

      - name: Public core boundary
        env:
          CARGO_INCREMENTAL: "0"
        run: scripts/check-core-boundary.sh

      - name: Rust formatting
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: cargo fmt --manifest-path src-tauri/core/Cargo.toml --check

      - name: Rust lint
        if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo clippy --manifest-path src-tauri/core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Core and ACP lint
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.companion == 'true' || github.event_name != 'pull_request'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-core --package muniment-acp --all-targets --locked -- -D warnings

      - name: Rust unit tests
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.resident_model_adr == 'true' || github.event_name != 'pull_request'
        # The shared runner can starve stub child processes under default test parallelism.
        run: cargo test --manifest-path src-tauri/core/Cargo.toml --locked --features network-tests -- --test-threads=1

      - name: Core and ACP unit tests
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.companion == 'true' || github.event_name != 'pull_request'
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-core --package muniment-acp --locked

      - name: Companion formatting
        if: needs.changes.outputs.companion == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-code-diff --package muniment-cli --package muniment-acp --check

      - name: Companion lint
        if: needs.changes.outputs.companion == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-code-diff --package muniment-cli --package muniment-acp --all-targets --locked -- -D warnings

      - name: Companion unit tests
        if: needs.changes.outputs.companion == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-code-diff --package muniment-cli --package muniment-acp --locked

      - name: CLI dependency boundary
        if: needs.changes.outputs.companion == 'true'
        run: test/cli-dependency-boundary.sh

      - name: Runtime formatting
        if: needs.changes.outputs.companion == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --package muniment-runtime --check

      - name: Runtime lint
        if: needs.changes.outputs.companion == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-runtime --all-targets --locked -- -D warnings

      - name: Runtime unit tests
        if: needs.changes.outputs.companion == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked

      - name: Runtime dependency boundary
        if: needs.changes.outputs.companion == 'true'
        run: test/runtime-dependency-boundary.sh

      - name: Go toolchain for the reader sidecar
        if: needs.changes.outputs.companion == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: src-tauri/reader/go.mod

      - name: Reader sidecar format, vet and tests
        if: needs.changes.outputs.companion == 'true'
        working-directory: src-tauri/reader
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt would change:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./... && go test ./...

  attach-fixtures-current:
    name: attach-fixtures-current
    if: github.event_name == 'pull_request' && needs.changes.outputs.attach_fixtures == 'true'
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust contract tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked

      - name: Check canonical fixtures
        working-directory: src-tauri
        run: cargo run -p muniment-attach --bin export-attach-fixtures -- ../protocol-fixtures --check

      - name: Windows fixture publication
        env:
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"
          cmd='cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked && cargo run --manifest-path src-tauri/Cargo.toml --package muniment-attach --bin export-attach-fixtures -- protocol-fixtures --check'
          ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 \
              "sudo desktop-ci windows --repo '$repo_url' --ref '$REF' --cmd '$cmd'"

  code-diff-fixtures-current:
    name: code-diff-fixtures-current
    if: github.event_name == 'pull_request' && needs.changes.outputs.code_diff_fixtures == 'true'
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust contract tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-code-diff --locked

      - name: Check canonical fixtures
        working-directory: src-tauri
        run: cargo run -p muniment-code-diff --bin export-code-diff-fixtures -- ../protocol-fixtures --check

  desktop-compile:
    name: Desktop compile preflight (${{ matrix.platform }})
    if: github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true'
    needs: changes
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Check (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          cmd='cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          if [ "$PLATFORM" = "linux" ]; then
            cmd='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev -o DPkg::Lock::Timeout=300 && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-acp --release --locked && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --release --locked && CGO_ENABLED=0 go build -C src-tauri/reader -trimpath -ldflags "-s -w" -o ../target/release/muniment-reader . && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          fi
          if [ "$PLATFORM" = "windows" ]; then
            cmd='npm ci --no-audit --no-fund && npx vitest run --root . test/desktop-e2e-harness.test.js && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test browser_control_windows_identity && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test browser_control_windows_transport && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_known_folders && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_sid && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_task_service && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --lib windows_task_service && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_listener && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_instance_lock && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_connect && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_credential && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_stream && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_peer_native && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_route_native && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_session && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --lib windows_user_diagnostics && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --lib && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --test windows_acl && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --test windows_attach_acceptor && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --release --locked && go build -C src-tauri/reader -trimpath -ldflags "-s -w" -o ../target/release/muniment-reader.exe . && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          fi
          # macOS ships a universal app — preflight the arm64 cross slice too.
          # The E2E window probe is C that only the macOS SDK can build, and the
          # nightly compiles it on the test VM, so build it here as well. A
          # broken helper then fails this PR instead of the nightly smoke gate.
          if [ "$PLATFORM" = "macos" ]; then
            cmd='rustup target add aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --package muniment-desktop --locked --features e2e-webdriver --target aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --locked --bins --target aarch64-apple-darwin && clang -std=gnu17 -O2 -Wall -Wno-deprecated-declarations -framework CoreFoundation -framework CoreGraphics -o /tmp/macos-window-count test/e2e/support/macos-window-count.c'
          fi
          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"

          # Keep the check command inside --cmd and pass clone credentials only
          # through --repo, matching the desktop build invocation below.
          attempt=1
          while true; do
            if ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
                 desktopci@10.1.10.10 \
                 "sudo desktop-ci $PLATFORM --repo '$repo_url' --ref '$REF' --cmd '$cmd'"; then
              status=0
            else
              status=$?
            fi
            # desktop-ci infrastructure failures return status 3, while an SSH
            # connection lost before or during driver startup returns 255.
            # Either gets one bounded retry on every platform; command/test
            # failures remain non-retryable.
            if { [ "$status" -ne 3 ] && [ "$status" -ne 255 ]; } || \
               [ "$attempt" -ge 2 ]; then
              exit "$status"
            fi
            echo "desktop-ci infrastructure setup failed; retrying once"
            attempt=$((attempt + 1))
          done

  desktop-build:
    if: github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true' && needs.changes.outputs.installer == 'true'
    needs: [changes, desktop-compile]
    runs-on: self-hosted
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Build (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          # macOS: .app only — dmg bundling needs a GUI session (release-time step)
          # --test-threads=1: the linux desktop-ci VM has few cores; the chat
          # coordinator/receipt tests spawn a stub subprocess that must connect
          # back within a deadline, and default (num_cpus) test parallelism starves
          # it under load → intermittent "coordinator did not request its receipt".
          # Serialize the test run so the spawned process always gets a core.
          # CARGO_INCREMENTAL=0: the desktop-ci VM builds from a throwaway clone,
          # so test-profile incremental artifacts are never reused — they only add
          # disk writes (the same target/debug/incremental dep-graph writes that hit
          # ENOSPC on the sibling smoke job) and bookkeeping overhead to an already
          # disk-pressured, few-core VM. The release tauri build is non-incremental
          # by default, so this only affects the debug `cargo test` compile.
          # The coordinator tests execute the example stub; `cargo test` does not
          # build examples marked `test = false`, so build its current source first.
          cmd='CARGO_INCREMENTAL=0 cargo build --manifest-path src-tauri/Cargo.toml --locked --profile test --example sidecar-test-stub && CARGO_INCREMENTAL=0 cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --no-audit --no-fund && npm run tauri build'
          if [ "$PLATFORM" = "linux" ]; then
            cmd='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev -o DPkg::Lock::Timeout=900 && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-acp --release --locked && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --release --locked && CGO_ENABLED=0 go build -C src-tauri/reader -trimpath -ldflags "-s -w" -o ../target/release/muniment-reader . && CARGO_INCREMENTAL=0 cargo build --manifest-path src-tauri/Cargo.toml --locked --profile test --example sidecar-test-stub && CARGO_INCREMENTAL=0 cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --no-audit --no-fund && bash .github/build-linux.sh'
          fi
          if [ "$PLATFORM" = "windows" ]; then
            cmd='npm ci --no-audit --no-fund && node .github/build-windows-installers.mjs && powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/windows-installers.ps1'
          fi
          if [ "$PLATFORM" = "macos" ]; then
            cmd='npm ci --no-audit --no-fund && rustup target add aarch64-apple-darwin && node .github/build-macos-runtime.mjs && npm run tauri build -- --target universal-apple-darwin --bundles app'
          fi

          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"

          # Remote args are single-quoted so the build command's && stays
          # inside --cmd instead of being parsed by the pve01 shell.
          # desktop-ci accepts clone credentials only in --repo, so the token is
          # temporarily visible in local and remote process listings.
          attempt=1
          while true; do
            attempt_log="$RUNNER_TEMP/desktop-ci-$PLATFORM-$attempt.log"
            if ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
                   desktopci@10.1.10.10 \
                   "sudo desktop-ci $PLATFORM --repo '$repo_url' --ref '$REF' --cmd '$cmd'" \
                   2>&1 | tee "$attempt_log"; then
              status=0
            else
              status="${PIPESTATUS[0]}"
            fi
            retry_wix_download=false
            if [ "$PLATFORM" = "windows" ] && [ "$status" -eq 1 ] && \
               grep -Fq 'failed to bundle project: `Peer disconnected`' "$attempt_log"; then
              retry_wix_download=true
            fi
            if { [ "$status" -ne 3 ] && [ "$status" -ne 255 ] && \
                 [ "$retry_wix_download" = false ]; } || \
               [ "$attempt" -ge 2 ]; then
              exit "$status"
            fi
            if [ "$retry_wix_download" = true ]; then
              echo "WiX download failed. Retrying once."
            else
              echo "desktop-ci infrastructure setup failed. Retrying once."
            fi
            attempt=$((attempt + 1))
          done
