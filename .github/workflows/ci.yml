name: CI

# Desktop builds run through the pve01 desktop-ci driver (SSH-driven VM
# clones; see homelab docs/infra-notes.md "Desktop-CI GLUE built"). The
# runner container carries DESKTOP_CI_SSH_KEY, a restricted key whose only
# capability on pve01 is `sudo desktop-ci`. Builds are serialized by the
# driver's one-VM-at-a-time lock; matrix jobs also serialize on the single
# repo runner, so a code PR gate is smoke (structure check + unit tests) plus
# native Windows and macOS compile preflights, then three sequential platform
# builds. Markdown-only PRs run structure smoke only.
# Push-to-main runs smoke only — merges are already PR-gated.
# NOTE: the driver clones `--branch <ref>`, so we pass the branch NAME (the
# PR head ref), which builds the branch TIP, not necessarily the triggering
# SHA — fine for the merge gate, do not use for release artifact provenance.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: self-hosted
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      companion: ${{ steps.changes.outputs.companion }}
      attach_fixtures: ${{ steps.changes.outputs.attach_fixtures }}
      extension: ${{ steps.changes.outputs.extension }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify PR changes
        if: github.event_name == 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=true
          companion=false
          attach_fixtures=false
          extension=false
          desktop=false
          while IFS= read -r path; do
            case "$path" in
              *.md) ;;
              src-tauri/cli/*|src-tauri/cli/**)
                docs_only=false
                companion=true
                ;;
              editor-extension/*|editor-extension/**)
                docs_only=false
                extension=true
                ;;
              protocol-fixtures/*|protocol-fixtures/**)
                docs_only=false
                companion=true
                attach_fixtures=true
                extension=true
                ;;
              src-tauri/attach/*|src-tauri/attach/**)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                extension=true
                ;;
              src-tauri/Cargo.toml|src-tauri/Cargo.lock)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                extension=true
                ;;
              *)
                docs_only=false
                desktop=true
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "companion=$companion" >> "$GITHUB_OUTPUT"
          echo "attach_fixtures=$attach_fixtures" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

      - name: Node 24 (bootstrap if missing)
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: |
          node_dir="$HOME/.local/node-24"
          if { ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(`.`)[0]' 2>/dev/null)" != 24 ]; } \
              && [ ! -x "$node_dir/bin/node" ]; then
            case "$(uname -m)" in
              x86_64) node_arch=x64 ;;
              aarch64|arm64) node_arch=arm64 ;;
              *) printf 'unsupported Node architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
            esac
            mkdir -p "$node_dir"
            curl --proto '=https' --tlsv1.2 -sSfL \
              "https://nodejs.org/dist/v24.4.1/node-v24.4.1-linux-${node_arch}.tar.xz" \
              | tar -xJ --strip-components=1 -C "$node_dir"
          fi
          echo "$HOME/.local/node-24/bin" >> "$GITHUB_PATH"

      - name: Frontend unit tests
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund && npm test

      - name: Browser control relay core
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: npm ci --prefix browser-control --no-audit --no-fund && npm run browser-control

      # Unit tests cover src-tauri/core (muniment-core), which is kept free of
      # Tauri on purpose: compiling the tauri crate needs the GUI dev stack
      # (webkit2gtk etc.) that only the desktop-ci build VMs carry, while the
      # core crate compiles anywhere. The runner container persists, so the
      # rustup bootstrap below is a one-time cost.
      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          # rustc needs a C linker even for dependency-free crates
          if ! command -v cc >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev
          fi

      - name: Structure smoke
        run: test/smoke.sh

      - name: Rust formatting
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: cargo fmt --manifest-path src-tauri/core/Cargo.toml --check

      - name: Rust lint
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: cargo clippy --manifest-path src-tauri/core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rust unit tests
        if: steps.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
        run: cargo test --manifest-path src-tauri/core/Cargo.toml --locked

      - name: Companion formatting
        if: steps.changes.outputs.companion == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-cli --check

      - name: Companion lint
        if: steps.changes.outputs.companion == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-cli --all-targets --locked -- -D warnings

      - name: Companion unit tests
        if: steps.changes.outputs.companion == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-cli --locked

      - name: CLI dependency boundary
        if: steps.changes.outputs.companion == 'true'
        run: test/cli-dependency-boundary.sh

  extension-contract:
    name: extension-contract
    if: github.event_name == 'pull_request' && needs.smoke.outputs.extension == 'true'
    needs: smoke
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24 (bootstrap if missing)
        run: |
          node_dir="$HOME/.local/node-24"
          if { ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(`.`)[0]' 2>/dev/null)" != 24 ]; } \
              && [ ! -x "$node_dir/bin/node" ]; then
            case "$(uname -m)" in
              x86_64) node_arch=x64 ;;
              aarch64|arm64) node_arch=arm64 ;;
              *) printf 'unsupported Node architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
            esac
            mkdir -p "$node_dir"
            curl --proto '=https' --tlsv1.2 -sSfL \
              "https://nodejs.org/dist/v24.4.1/node-v24.4.1-linux-${node_arch}.tar.xz" \
              | tar -xJ --strip-components=1 -C "$node_dir"
          fi
          echo "$HOME/.local/node-24/bin" >> "$GITHUB_PATH"

      - name: Install extension dependencies
        working-directory: editor-extension
        run: npm ci --no-audit --no-fund

      - name: Typecheck extension
        working-directory: editor-extension
        run: npm run typecheck

      - name: Test extension contract
        working-directory: editor-extension
        run: npm test

      - name: Package extension VSIX
        working-directory: editor-extension
        run: npm run package -- --out "$RUNNER_TEMP/muniment-editor.vsix"

  attach-fixtures-current:
    name: attach-fixtures-current
    if: github.event_name == 'pull_request' && needs.smoke.outputs.attach_fixtures == 'true'
    needs: smoke
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust contract tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked

      - name: Check canonical fixtures
        working-directory: src-tauri
        run: cargo run -p muniment-attach --bin export-attach-fixtures -- ../protocol-fixtures --check

      - name: Windows fixture publication
        env:
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"
          cmd='cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked && cargo run --manifest-path src-tauri/Cargo.toml --package muniment-attach --bin export-attach-fixtures -- protocol-fixtures --check'
          ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 \
              "sudo desktop-ci windows --repo '$repo_url' --ref '$REF' --cmd '$cmd'"

  desktop-compile:
    name: Desktop compile preflight (${{ matrix.platform }})
    if: github.event_name == 'pull_request' && needs.smoke.outputs.desktop == 'true'
    needs: smoke
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Check (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          cmd='cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          if [ "$PLATFORM" = "linux" ]; then
            cmd='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          fi
          if [ "$PLATFORM" = "windows" ]; then
            cmd='cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test browser_control_windows_transport && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          fi
          # macOS ships a universal app — preflight the arm64 cross slice too.
          if [ "$PLATFORM" = "macos" ]; then
            cmd='rustup target add aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target aarch64-apple-darwin'
          fi
          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"

          # Keep the check command inside --cmd and pass clone credentials only
          # through --repo, matching the desktop build invocation below.
          ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 \
              "sudo desktop-ci $PLATFORM --repo '$repo_url' --ref '$REF' --cmd '$cmd'"

  desktop-build:
    if: github.event_name == 'pull_request' && needs.smoke.outputs.desktop == 'true'
    needs: [smoke, desktop-compile]
    runs-on: self-hosted
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Build (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          # macOS: .app only — dmg bundling needs a GUI session (release-time step)
          # --test-threads=1: the linux desktop-ci VM has few cores; the chat
          # coordinator/receipt tests spawn a stub subprocess that must connect
          # back within a deadline, and default (num_cpus) test parallelism starves
          # it under load → intermittent "coordinator did not request its receipt".
          # Serialize the test run so the spawned process always gets a core.
          cmd='cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --no-audit --no-fund && npm run tauri build'
          if [ "$PLATFORM" = "linux" ]; then
            cmd='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev && cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --no-audit --no-fund && bash .github/build-linux.sh'
          fi
          if [ "$PLATFORM" = "windows" ]; then
            cmd='npm ci --no-audit --no-fund && node .github/build-windows-installers.mjs && powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/windows-installers.ps1'
          fi
          if [ "$PLATFORM" = "macos" ]; then
            cmd='npm ci --no-audit --no-fund && rustup target add aarch64-apple-darwin && npm run tauri build -- --target universal-apple-darwin --bundles app'
          fi

          repo_url="https://x-access-token:${REPO_TOKEN}@github.com/${REPOSITORY}"

          # Remote args are single-quoted so the build command's && stays
          # inside --cmd instead of being parsed by the pve01 shell.
          # desktop-ci accepts clone credentials only in --repo, so the token is
          # temporarily visible in local and remote process listings.
          ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 \
              "sudo desktop-ci $PLATFORM --repo '$repo_url' --ref '$REF' --cmd '$cmd'"
