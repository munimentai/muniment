name: CI

# Native checks use disposable Proxmox VMs. Each platform runs its preflight
# and, for packaging changes, its installer build in the same VM and checkout.
# Release-only helpers run their JavaScript tests without native compilation.
# Main reuses green PR checks only for the exact tested Git tree.
# The nightly proves signed, installed apps on all platforms.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: changes
    runs-on: self-hosted
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      companion: ${{ steps.changes.outputs.companion }}
      attach_fixtures: ${{ steps.changes.outputs.attach_fixtures }}
      code_diff_fixtures: ${{ steps.changes.outputs.code_diff_fixtures }}
      desktop: ${{ steps.changes.outputs.desktop }}
      installer: ${{ steps.changes.outputs.installer }}
      release_tooling: ${{ steps.changes.outputs.release_tooling }}
      release_only: ${{ steps.changes.outputs.release_only }}
      resident_model_adr: ${{ steps.changes.outputs.resident_model_adr }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Reuse tested PR tree
        id: proof
        if: github.event_name == 'push'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { reusePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/lib/ci-proof.mjs`);
            core.setOutput('reuse', await reusePullRequest({ github, context, core, workflow: 'ci.yml' }));

      - name: Classify PR changes
        if: steps.proof.outputs.reuse != 'true'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=true
          companion=false
          attach_fixtures=false
          code_diff_fixtures=false
          desktop=false
          installer=false
          release_tooling=false
          release_only=true
          resident_model_adr=false
          if [ "${GITHUB_EVENT_NAME:-pull_request}" = push ]; then
            docs_only=false
            companion=true
            attach_fixtures=true
            code_diff_fixtures=true
            desktop=true
            installer=true
            release_only=false
          fi
          while IFS= read -r path; do
            # Only these standalone helpers bypass native checks. Unknown files
            # and signing or packaging helpers keep the full native gate.
            case "$path" in
              .github/lib/release-promotion.mjs|.github/lib/release-promotion.test.js|.github/lib/update-feed.mjs|.github/lib/update-feed.test.js|.github/lib/winget-manifest.mjs|.github/lib/winget-manifest.test.js|.github/lib/winget-release.mjs)
                docs_only=false
                release_tooling=true
                continue
                ;;
            esac
            release_only=false
            case "$path" in
              docs/decisions/0017-*.md)
                # Markdown, so this stays a docs-only PR for the native build
                # gates. But ADR 0017's pinned table is asserted field by field
                # against RESIDENT_MODEL by
                # src-tauri/core/tests/resident_model_adr.rs, and that guard is
                # worthless if it skips the case it exists for: the record
                # changing on its own.
                resident_model_adr=true
                ;;
              *.md) ;;
              src-tauri/cli/*|src-tauri/cli/**|src-tauri/runtime/*|src-tauri/runtime/**)
                docs_only=false
                companion=true
                ;;
              src-tauri/reader/*|src-tauri/reader/**)
                # The Go reader sidecar ships beside the runtime in every bundle.
                docs_only=false
                companion=true
                desktop=true
                ;;
              protocol-fixtures/code-diff/*|protocol-fixtures/code-diff/**)
                docs_only=false
                companion=true
                desktop=true
                code_diff_fixtures=true
                ;;
              protocol-fixtures/*|protocol-fixtures/**)
                docs_only=false
                companion=true
                attach_fixtures=true
                ;;
              src-tauri/attach/*|src-tauri/attach/**)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                ;;
              src-tauri/code-diff/*|src-tauri/code-diff/**)
                docs_only=false
                companion=true
                desktop=true
                code_diff_fixtures=true
                ;;
              src-tauri/acp/*|src-tauri/acp/**)
                docs_only=false
                companion=true
                ;;
              src-tauri/Cargo.toml|src-tauri/Cargo.lock)
                docs_only=false
                companion=true
                desktop=true
                attach_fixtures=true
                code_diff_fixtures=true
                ;;
              *)
                docs_only=false
                desktop=true
                ;;
            esac
            case "$path" in
              src-tauri/tauri*.conf.json|src-tauri/windows/*|src-tauri/packaging/*|src-tauri/capabilities/*|.github/build-*.mjs|.github/build-*.sh|.github/lib/*|.github/upload-nightly-assets.mjs|.github/workflows/ci.yml|test/e2e/*|test/windows-installers.ps1)
                # The installer, packaging, workflow and e2e paths are the ones
                # the nightly cannot prove one merge later without a red run,
                # so only these run the three-platform build on the PR.
                installer=true
                ;;
            esac
          done < <(if [ "${GITHUB_EVENT_NAME:-pull_request}" != push ]; then git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA"; fi)
          [ "$release_tooling" = true ] || release_only=false
          echo "release_tooling=$release_tooling" >> "$GITHUB_OUTPUT"
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "companion=$companion" >> "$GITHUB_OUTPUT"
          echo "attach_fixtures=$attach_fixtures" >> "$GITHUB_OUTPUT"
          echo "code_diff_fixtures=$code_diff_fixtures" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "resident_model_adr=$resident_model_adr" >> "$GITHUB_OUTPUT"


  smoke:
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Node 24 (bootstrap if missing)
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.release_tooling == 'true' || github.event_name != 'pull_request')
        run: |
          node_dir="$HOME/.local/node-24"
          if { ! command -v node >/dev/null 2>&1 || [ "$(node -p 'process.versions.node.split(`.`)[0]' 2>/dev/null)" != 24 ]; } \
              && [ ! -x "$node_dir/bin/node" ]; then
            # The SHA-256 values are the ones in the release's SHASUMS256.txt.
            case "$(uname -m)" in
              x86_64) node_arch=x64; node_sha256=7e067b13cd0dc7ee8b239f4ebe1ae54f3bba3a6e904553fcb5f581530eb8306d ;;
              aarch64|arm64) node_arch=arm64; node_sha256=555659c36fc72d0617e278b5d26ffcaebc3760a3de354926b1e5f1b0bfd66083 ;;
              *) printf 'unsupported Node architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
            esac
            node_archive="$RUNNER_TEMP/node-v24.4.1-linux-${node_arch}.tar.xz"
            curl --proto '=https' --tlsv1.2 -sSfL -o "$node_archive" \
              "https://nodejs.org/dist/v24.4.1/node-v24.4.1-linux-${node_arch}.tar.xz"
            printf '%s  %s\n' "$node_sha256" "$node_archive" | sha256sum --check --quiet
            mkdir -p "$node_dir"
            tar -xJf "$node_archive" --strip-components=1 -C "$node_dir"
            rm -f "$node_archive"
          fi
          echo "$HOME/.local/node-24/bin" >> "$GITHUB_PATH"

      - name: Release tooling tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.release_tooling == 'true' && needs.changes.outputs.desktop != 'true')
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --root . .github/lib/release-promotion.test.js .github/lib/update-feed.test.js .github/lib/winget-manifest.test.js

      - name: Frontend unit tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request')
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Probe fixtures
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request')
        run: npm run probe:check

      - name: UI copy law
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request')
        run: npm run lint:copy

      - name: Browser control relay core
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request')
        run: npm ci --prefix browser-control --no-audit --no-fund && npm run browser-control

      # Unit tests cover src-tauri/core (muniment-core), which is kept free of
      # Tauri on purpose: compiling the tauri crate needs the GUI dev stack
      # (webkit2gtk etc.) that only the desktop-ci build VMs carry, while the
      # core crate compiles anywhere. The runner container persists, so the
      # rustup bootstrap below is a one-time cost.
      - name: Rust toolchain (bootstrap if missing)
        if: needs.changes.outputs.reuse != 'true'
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            bash .github/bootstrap-rustup.sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          # rustc needs a C linker even for dependency-free crates
          if ! command -v cc >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev
          fi

      - name: Structure smoke
        if: needs.changes.outputs.reuse != 'true'
        run: test/smoke.sh

      - name: Steering check
        if: needs.changes.outputs.reuse != 'true'
        run: scripts/check-steering.sh .

      - name: Public core boundary
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.release_only != 'true')
        env:
          CARGO_INCREMENTAL: "0"
        run: scripts/check-core-boundary.sh

      - name: Rust formatting
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request')
        run: cargo fmt --manifest-path src-tauri/core/Cargo.toml --check

      - name: Core and ACP lint
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.companion == 'true' || github.event_name != 'pull_request')
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-core --package muniment-acp --all-targets --locked -- -D warnings

      - name: Rust unit tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.resident_model_adr == 'true' || github.event_name != 'pull_request')
        # The shared runner can starve stub child processes under default test parallelism.
        run: cargo test --manifest-path src-tauri/core/Cargo.toml --locked --features network-tests -- --test-threads=1

      - name: Core default-feature tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.companion == 'true' || github.event_name != 'pull_request')
        # Match the serial core run above so deadline tests do not starve each other.
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-core --locked -- --test-threads=1

      - name: Companion formatting
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-code-diff --package muniment-cli --package muniment-acp --check

      - name: Companion lint
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-attach --package muniment-code-diff --package muniment-cli --all-targets --locked -- -D warnings

      - name: Attach client-feature tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked --features client

      - name: CLI dependency boundary
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: test/cli-dependency-boundary.sh

      - name: Runtime formatting
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --package muniment-runtime --check

      - name: Runtime lint
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --package muniment-runtime --all-targets --locked -- -D warnings

      - name: Runtime dependency boundary
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        run: test/runtime-dependency-boundary.sh

      - name: Go toolchain for the reader sidecar
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src-tauri/reader/go.mod

      - name: Reader sidecar format, vet and tests
        if: needs.changes.outputs.reuse != 'true' && (needs.changes.outputs.companion == 'true')
        working-directory: src-tauri/reader
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt would change:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./... && go test ./...

      - name: Record tested PR tree
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { writeProof } = await import(`${process.env.GITHUB_WORKSPACE}/.github/lib/ci-proof.mjs`);
            writeProof(context, 'ci.yml');

      - name: Save tested PR tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci.yml-proof
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  attach-fixtures-current:
    name: attach-fixtures-current
    if: needs.changes.outputs.attach_fixtures == 'true'
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            bash .github/bootstrap-rustup.sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check canonical fixtures
        working-directory: src-tauri
        run: cargo run -p muniment-attach --bin export-attach-fixtures -- ../protocol-fixtures --check

      - name: Windows fixture publication
        env:
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
        run: |
          set -u
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" > "$known_hosts"

          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo 'Invalid source SHA' >&2; exit 1 ;;
          esac
          repo_url="https://github.com/${REPOSITORY}"
          cmd='cargo test --manifest-path src-tauri/Cargo.toml --package muniment-attach --locked && cargo run --manifest-path src-tauri/Cargo.toml --package muniment-attach --bin export-attach-fixtures -- protocol-fixtures --check'
          cmd="git fetch --depth 1 origin $SOURCE_SHA && git checkout --detach $SOURCE_SHA && $cmd"
          ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 \
              "sudo desktop-ci windows --repo '$repo_url' --ref '$REF' --cmd '$cmd' --env-stdin" <<<"GH_TOKEN=$REPO_TOKEN"

  code-diff-fixtures-current:
    name: code-diff-fixtures-current
    if: needs.changes.outputs.code_diff_fixtures == 'true'
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            bash .github/bootstrap-rustup.sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check canonical fixtures
        working-directory: src-tauri
        run: cargo run -p muniment-code-diff --bin export-code-diff-fixtures -- ../protocol-fixtures --check

  desktop-compile:
    name: Desktop compile preflight (${{ matrix.platform }})
    if: needs.changes.outputs.desktop == 'true'
    needs: changes
    runs-on: self-hosted
    # Packaging shares the preflight VM, including its dependency and build cache.
    timeout-minutes: ${{ needs.changes.outputs.installer == 'true' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - name: Check (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          INSTALLER: ${{ needs.changes.outputs.installer }}
          REPO_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              printf 'error: unsafe branch ref for desktop-ci: %s\n' "$REF" >&2
              exit 1
              ;;
          esac

          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" > "$known_hosts"

          cmd='cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          if [ "$PLATFORM" = "linux" ]; then
            cmd='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev cmake ninja-build zlib1g-dev libzstd-dev -o DPkg::Lock::Timeout=300 && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-acp --release --locked && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --release --locked && bash .github/build-reader.sh src-tauri/target/release/muniment-reader && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets'
          fi
          if [ "$PLATFORM" = "windows" ]; then
            cmd='npm ci --ignore-scripts --no-audit --no-fund && npx vitest run --root . test/desktop-e2e-harness.test.js .github/lib/windows-update-target.test.js .github/lib/windows-installed-smoke.test.js && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test browser_control_windows_identity && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test browser_control_windows_transport && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_known_folders && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_sid && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test windows_task_service && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --lib windows_task_service && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_listener && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_instance_lock && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_connect && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_credential && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_stream && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_peer_native && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_route_native && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --test attach_windows_session && cargo test --manifest-path src-tauri/core/Cargo.toml --locked --lib windows_user_diagnostics && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --lib && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --test windows_acl && cargo test --manifest-path src-tauri/Cargo.toml --package muniment-runtime --locked --test windows_attach_acceptor && cargo build --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --release --locked && powershell.exe -NoProfile -ExecutionPolicy Bypass -File .github/build-reader.ps1 src-tauri/target/release/muniment-reader.exe && powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-cef-windows.ps1'
          fi
          # macOS ships a universal app — preflight the arm64 cross slice too.
          # The E2E window probe is C that only the macOS SDK can build, and the
          # nightly compiles it on the test VM, so build it here as well. A
          # broken helper then fails this PR instead of the nightly smoke gate.
          if [ "$PLATFORM" = "macos" ]; then
            cmd='. scripts/prepare-cef-macos.sh && rustup target add aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --target aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --package muniment-desktop --locked --features e2e-webdriver --target aarch64-apple-darwin && cargo check --manifest-path src-tauri/Cargo.toml --package muniment-runtime --package muniment-cli --locked --bins --target aarch64-apple-darwin && clang -std=gnu17 -O2 -Wall -Wno-deprecated-declarations -framework CoreFoundation -framework CoreGraphics -o /tmp/macos-window-count test/e2e/support/macos-window-count.c'
          fi
          build_timeout=3600
          if [ "$INSTALLER" = true ]; then
            preflight_cmd=$cmd
            cmd='CARGO_INCREMENTAL=0 cargo build --manifest-path src-tauri/Cargo.toml --locked --profile test --example sidecar-test-stub && CARGO_INCREMENTAL=0 cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --ignore-scripts --no-audit --no-fund && npm run tauri build'
            if [ "$PLATFORM" = "linux" ]; then
              cmd='CARGO_INCREMENTAL=0 cargo build --manifest-path src-tauri/Cargo.toml --locked --profile test --example sidecar-test-stub && CARGO_INCREMENTAL=0 cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1 && npm ci --ignore-scripts --no-audit --no-fund && MUNIMENT_SIDECARS_BUILT=1 bash .github/build-linux.sh'
            fi
            if [ "$PLATFORM" = "windows" ]; then
              cmd='node .github/build-windows-installers.mjs && powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/windows-installers.ps1'
            fi
            if [ "$PLATFORM" = "macos" ]; then
              cmd='npm ci --ignore-scripts --no-audit --no-fund && node .github/build-macos-runtime.mjs && npm run tauri build -- --target universal-apple-darwin --no-bundle && node .github/build-macos-cef-helper.mjs && npm run tauri bundle -- --target universal-apple-darwin --bundles app && node scripts/package-cef-macos.mjs src-tauri/target/universal-apple-darwin/release/bundle/macos/muniment.app --universal'
            fi
            cmd="$preflight_cmd && $cmd"
            build_timeout=5400
          fi
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo 'Invalid source SHA' >&2; exit 1 ;;
          esac
          repo_url="https://github.com/${REPOSITORY}"

          cmd="git fetch --depth 1 origin $SOURCE_SHA && git checkout --detach $SOURCE_SHA && $cmd"

          attempt=1
          while true; do
            attempt_log="$RUNNER_TEMP/desktop-ci-$PLATFORM-$attempt.log"
            if ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
                   -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
                   desktopci@10.1.10.10 \
                   "sudo desktop-ci $PLATFORM --repo '$repo_url' --ref '$REF' --cmd '$cmd' --build-timeout '$build_timeout' --env-stdin" <<<"GH_TOKEN=$REPO_TOKEN" \
                   2>&1 | tee "$attempt_log"; then
              status=0
            else
              status="${PIPESTATUS[0]}"
            fi
            retry_wix_download=false
            if [ "$PLATFORM" = "windows" ] && [ "$status" -eq 1 ] && \
               grep -Fq 'failed to bundle project: `Peer disconnected`' "$attempt_log"; then
              retry_wix_download=true
            fi
            if { [ "$status" -ne 3 ] && [ "$status" -ne 255 ] && \
                 [ "$retry_wix_download" = false ]; } || \
               [ "$attempt" -ge 2 ]; then
              exit "$status"
            fi
            if [ "$retry_wix_download" = true ]; then
              echo "WiX download failed. Retrying once."
            else
              echo "desktop-ci infrastructure setup failed. Retrying once."
            fi
            attempt=$((attempt + 1))
          done
