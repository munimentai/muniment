name: Promote stable desktop release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character SHA finalized by the nightly release"
        required: true
        type: string
      version:
        description: "Strict stable version (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
permissions:
  contents: write
  checks: read
concurrency:
  # Share the nightly lock so its tag/assets cannot move between validation
  # and publication; this also serializes stable promotions.
  group: nightly-desktop-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - name: Assert WebDriver marker and capability absence from release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/muniment-release-guard.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          gh release download nightly --pattern "nightly-${SOURCE_SHA}-*" --dir "$work/assets"
          for artifact in "$work"/assets/*; do
            bash test/e2e/support/webdriver-artifact-guard.sh absent "$artifact"
          done
          node test/e2e/support/webdriver-capability-guard.mjs
      - name: Promote finalized nightly bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: node .github/lib/release-promotion.mjs "$GH_TOKEN" "$REPOSITORY" "$SOURCE_SHA" "$VERSION"

  draft-winget-pr:
    name: Draft WinGet manifest PR
    needs: promote
    runs-on: self-hosted
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          path: muniment-desktop
      - name: Check out winget-pkgs
        uses: actions/checkout@v7
        with:
          repository: microsoft/winget-pkgs
          path: winget-pkgs
      - name: Generate manifest from the published machine MSI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: node muniment-desktop/.github/lib/winget-release.mjs "$GH_TOKEN" "$REPOSITORY" "$VERSION" winget-pkgs
      - name: Draft manifest PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: winget-pkgs
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          push-to-fork: mikeydiamonds/winget-pkgs
          branch: winget/muniment-${{ inputs.version }}
          delete-branch: true
          draft: true
          commit-message: "New version: Muniment.Muniment ${{ inputs.version }}"
          title: "New version: Muniment.Muniment ${{ inputs.version }}"
          body: "Automated draft for the signed, per-machine MSI from the Muniment stable release."
