name: Installed subscription acceptance

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Select a platform for a repair check. Only all produces full release acceptance."
        type: choice
        default: all
        options: [all, linux, windows, macos-arm64, macos-x64]
      source_sha:
        description: "Exact 40-character SHA of the signed nightly candidate"
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: "Exact 40-character SHA of the signed nightly candidate"
        required: true
        type: string

# Keep harness repairs separate from the signed candidate bytes.
env:
  HARNESS_SHA: ${{ github.sha }}

# Nightly builds the candidate. Native runners test its installed packages.
permissions:
  contents: read
  actions: read

concurrency:
  group: subscription-acceptance-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  # Native desktop-ci jobs inherit the private release runner's SSH key.
  linux:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: muniment-release
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: linux
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out subscription harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
      - name: Clear platform output
        run: rm -rf "$RUNNER_TEMP/subscription-linux"
      - name: Run installed subscription check
        env:
          OUTPUT: ${{ runner.temp }}/subscription-linux
          RELEASE_TOKEN: ${{ github.token }}
          FACTORY_SUBSCRIPTION_LEASES: ${{ secrets.FACTORY_SUBSCRIPTION_LEASES }}
          FACTORY_SUBSCRIPTION_MODELS: ${{ vars.FACTORY_SUBSCRIPTION_MODELS }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
        run: node test/e2e/runner/subscription-host.mjs
      - uses: ./.github/actions/store-artifact
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        with:
          name: subscription-linux
          path: ${{ runner.temp }}/subscription-linux
          source: ${{ inputs.source_sha }}

  windows:
    needs: linux
    if: always() && !cancelled() && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: muniment-release
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: windows
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out subscription harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
      - name: Clear platform output
        run: rm -rf "$RUNNER_TEMP/subscription-windows"
      - name: Run installed subscription check
        env:
          OUTPUT: ${{ runner.temp }}/subscription-windows
          RELEASE_TOKEN: ${{ github.token }}
          FACTORY_SUBSCRIPTION_LEASES: ${{ secrets.FACTORY_SUBSCRIPTION_LEASES }}
          FACTORY_SUBSCRIPTION_MODELS: ${{ vars.FACTORY_SUBSCRIPTION_MODELS }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
        run: node test/e2e/runner/subscription-host.mjs
      - uses: ./.github/actions/store-artifact
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        with:
          name: subscription-windows
          path: ${{ runner.temp }}/subscription-windows
          source: ${{ inputs.source_sha }}

  macos-arm64:
    needs: windows
    if: always() && !cancelled() && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos-arm64')
    # macos-15 supplies a fresh ARM64 VM and console login for this job.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: macos-arm64
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out subscription harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
      - name: Clear platform output
        run: rm -rf "$RUNNER_TEMP/subscription-macos-arm64"
      - name: Run installed ARM64 subscription check
        env:
          OUTPUT: ${{ runner.temp }}/subscription-macos-arm64
          GH_TOKEN: ${{ github.token }}
          FACTORY_SUBSCRIPTION_LEASES: ${{ secrets.FACTORY_SUBSCRIPTION_LEASES }}
          FACTORY_SUBSCRIPTION_MODELS: ${{ vars.FACTORY_SUBSCRIPTION_MODELS }}
        run: node test/e2e/runner/subscription-macos-arm64.mjs
      - uses: ./.github/actions/store-artifact
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        with:
          name: subscription-macos-arm64
          path: ${{ runner.temp }}/subscription-macos-arm64
          source: ${{ inputs.source_sha }}

  macos-x64:
    needs: macos-arm64
    if: always() && !cancelled() && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos-x64')
    runs-on: muniment-release
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: macos-x64
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out subscription harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
      - name: Clear platform output
        run: rm -rf "$RUNNER_TEMP/subscription-macos-x64"
      - name: Run installed subscription check
        env:
          OUTPUT: ${{ runner.temp }}/subscription-macos-x64
          RELEASE_TOKEN: ${{ github.token }}
          FACTORY_SUBSCRIPTION_LEASES: ${{ secrets.FACTORY_SUBSCRIPTION_LEASES }}
          FACTORY_SUBSCRIPTION_MODELS: ${{ vars.FACTORY_SUBSCRIPTION_MODELS }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
        run: node test/e2e/runner/subscription-host.mjs
      - uses: ./.github/actions/store-artifact
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        with:
          name: subscription-macos-x64
          path: ${{ runner.temp }}/subscription-macos-x64
          source: ${{ inputs.source_sha }}

  collect:
    needs: [linux, windows, macos-arm64, macos-x64]
    if: always() && !cancelled() && (inputs.platform == '' || inputs.platform == 'all')
    runs-on: self-hosted
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out subscription harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
      - name: Clear collection directories
        run: rm -rf "$RUNNER_TEMP/subscription-inputs" "$RUNNER_TEMP/release-acceptance"
      - uses: ./.github/actions/setup-artifact-store
      - name: Download platform evidence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        run: |
          for platform in linux windows macos-arm64 macos-x64; do
            # A missing or invalid download leaves no directory. The collector rejects it.
            node .github/lib/artifact-store.mjs download "subscription-$platform" \
              "$RUNNER_TEMP/subscription-inputs/subscription-$platform" || echo "No verified evidence for $platform."
          done
      - name: Generate release-acceptance
        id: collect
        env:
          OUTPUT: ${{ runner.temp }}/release-acceptance
          SUBSCRIPTION_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set +e
          node test/e2e/runner/collect-subscriptions.mjs "$SOURCE_SHA" "$OUTPUT" \
            "$RUNNER_TEMP/subscription-inputs/subscription-linux" \
            "$RUNNER_TEMP/subscription-inputs/subscription-windows" \
            "$RUNNER_TEMP/subscription-inputs/subscription-macos-arm64" \
            "$RUNNER_TEMP/subscription-inputs/subscription-macos-x64"
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/store-artifact
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
        with:
          name: release-acceptance
          path: ${{ runner.temp }}/release-acceptance
          source: ${{ inputs.source_sha }}
      - name: Preserve collector result
        if: always()
        env:
          COLLECT_STATUS: ${{ steps.collect.outputs.status }}
        run: |
          test "$COLLECT_STATUS" = 0
          echo 'The installed release acceptance checks passed on all four platforms.'
