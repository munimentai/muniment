name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reuse tested PR tree
        id: proof
        if: github.event_name == 'push'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { reusePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/lib/ci-proof.mjs`);
            core.setOutput('reuse', await reusePullRequest({ github, context, core, workflow: 'secret-scan.yml' }));

      - name: Install gitleaks
        if: steps.proof.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          VERSION=8.30.1
          # The SHA-256 is the value in the release's gitleaks_8.30.1_checksums.txt.
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$SHA256" /tmp/gitleaks.tar.gz | sha256sum --check --quiet
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan for secrets
        if: steps.proof.outputs.reuse != 'true'
        run: /tmp/gitleaks dir . --no-banner --verbose --redact --exit-code 1

      - name: Scan this pull request's commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: /tmp/gitleaks git . --no-banner --verbose --redact --exit-code 1 --log-opts="origin/${BASE_REF}..HEAD"

      - name: Record tested PR tree
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { writeProof } = await import(`${process.env.GITHUB_WORKSPACE}/.github/lib/ci-proof.mjs`);
            writeProof(context, 'secret-scan.yml');

      - name: Save tested PR tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan.yml-proof
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
