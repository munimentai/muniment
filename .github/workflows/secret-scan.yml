name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan for secrets
        run: /tmp/gitleaks dir . --no-banner --redact --exit-code 1

      - name: Scan this pull request's commits for secrets
        if: github.event_name == 'pull_request'
        run: /tmp/gitleaks git . --no-banner --redact --exit-code 1 --log-opts="origin/${{ github.base_ref }}..HEAD"
