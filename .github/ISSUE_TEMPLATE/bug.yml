name: Bug report
description: Report a problem with the desktop app.
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, personal files, and private conversations from reports and attachments.
        For a vulnerability, use the repository Security tab instead of a public issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the release version or source revision.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS on Apple Silicon, Windows on x64, or Linux distribution and desktop
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small example with sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include an error message or screenshot if useful. Remove sensitive details.
    validations:
      required: true
