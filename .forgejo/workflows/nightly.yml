name: Nightly desktop release

# Forgejo runs .forgejo/workflows/nightly.yml, a byte-identical copy of this
# file, and GitHub keeps this workflow disabled. GitHub Releases on
# munimentai/muniment host the files. Every Releases call uses the
# GH_RELEASE_TOKEN secret, and the job token reaches only Forgejo. Installed
# subscription acceptance runs on GitHub as subscriptions.yml, dispatched with
# the finalized source SHA, because its native runners are there.

on:
  # Release candidates run on demand so repairs do not compete with a daily
  # full matrix. Keep the workflow name used by stable promotion proofs.
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build (targeted re-runs). Non-'all' skips publish."
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: muniment-checks
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      # Forgejo runners have no job-started hook, so the first step admits only
      # an owner dispatch of main before any later step reads a credential.
      - name: Admit only an owner dispatch of main
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$REPOSITORY" != factory/muniment ] || [ "$EVENT" != workflow_dispatch ] || [ "$REF" != refs/heads/main ] || [ "$ACTOR" != mikeydiamonds ]; then
            echo '::error::Release jobs run only from an owner dispatch of main in factory/muniment.' >&2
            exit 1
          fi

      - name: Resolve the dispatched revision
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The dispatched revision must be a 40-character SHA.' >&2; exit 1; }
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      # The build VMs fetch the source from GitHub, so this waits for the push
      # mirror before it makes sure the rolling pre-release exists.
      - name: Ensure rolling pre-release exists
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node .github/lib/nightly-release.mjs ensure munimentai/muniment "$SOURCE_SHA"

  build:
    needs: prepare
    runs-on: self-hosted
    # Allow 120 minutes for the slot, 100 for the guest and collection, and 15 for cleanup and upload.
    timeout-minutes: 235
    env:
      DESKTOP_CI_SLOT_SECONDS: 7200
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Full matrix on schedule / platform=all; a single platform on a targeted dispatch.
        platform: ${{ fromJSON((github.event.inputs.platform == '' || github.event.inputs.platform == 'all') && '["linux","windows","macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      # Forgejo runners have no job-started hook, so the first step admits only
      # an owner dispatch of main before any later step reads a credential.
      - name: Admit only an owner dispatch of main
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$REPOSITORY" != factory/muniment ] || [ "$EVENT" != workflow_dispatch ] || [ "$REF" != refs/heads/main ] || [ "$ACTOR" != mikeydiamonds ]; then
            echo '::error::Release jobs run only from an owner dispatch of main in factory/muniment.' >&2
            exit 1
          fi

      - name: Check out updater signing helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Build and upload (${{ matrix.platform }}) via desktop-ci
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          REPOSITORY: munimentai/muniment
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
          # Azure Artifact Signing (Windows). Empty until the six repo secrets
          # exist => unsigned build. TENANT/CLIENT/SECRET authenticate the
          # service principal; ENDPOINT/ACCOUNT/PROFILE address the cert profile.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          # Apple Developer ID signing + notarization (macOS). Empty until the
          # six repo secrets exist => unsigned build. CERTIFICATE/PASSWORD import
          # the Developer ID Application cert; API_KEY/API_KEY_ID/API_ISSUER
          # authenticate notarytool; TEAM_ID identifies the account.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
        run: |
          set -u
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" > "$key"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" > "$known_hosts"

          # Build VMs install packages without install scripts, and no step
          # before signing sees a signing secret. The updater key never enters
          # a VM: the next step signs the uploaded update bundles on the runner.
          build='sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev cmake ninja-build zlib1g-dev libzstd-dev && npm ci --ignore-scripts --no-audit --no-fund && bash .github/build-linux.sh'
          if [ "$PLATFORM" = "windows" ]; then
            build='node .github/build-windows-installers.mjs --install-dependencies && powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/windows-installers.ps1'
          fi
          build_timeout=3600
          if [ "$PLATFORM" = "macos" ]; then
            # Allow 80 minutes for setup, compilation, two notarization batches, packaging, and upload.
            build_timeout=4800
            # The first step takes the signing line out of /tmp/dci_env into an
            # unexported shell variable, and the package step reads it on stdin.
            build='signing_env=$(node .github/lib/signing-env.mjs) && . scripts/prepare-cef-macos.sh && npm ci --ignore-scripts --no-audit --no-fund && rustup target add aarch64-apple-darwin && printf %s "$signing_env" | MACOS_BUILD_REMAINING_SECONDS=$((macos_build_seconds - $(date +%s) + macos_build_started)) node .github/build-macos-app.mjs'
          fi

          # The VM is destroyed when desktop-ci exits, so completed bundles are
          # uploaded from inside it. desktop-ci does a shallow clone of main's
          # tip; fetch the pinned commit BY HASH before checkout so all three
          # serialized platforms build the exact same source even when main
          # advances mid-run (a shallow branch clone can't check out a commit
          # that is no longer the tip -> "unable to read tree", macOS built last
          # so hit it most).
          cmd="git fetch --depth 1 origin $SOURCE_SHA && git checkout --detach $SOURCE_SHA && $build && node .github/upload-nightly-assets.mjs $REPOSITORY $SOURCE_SHA $PLATFORM"
          # Start the macOS clock inside the VM before Git and dependency setup.
          if [ "$PLATFORM" = "macos" ]; then
            cmd="macos_build_seconds=$build_timeout && "'macos_build_started=$(date +%s) && '"$cmd"
          fi
          repo_url="https://github.com/${REPOSITORY}.git"
          ssh_cmd="sudo desktop-ci $PLATFORM --repo '$repo_url' --ref 'main' --cmd '$cmd' --build-timeout '$build_timeout' --env-stdin"
          ssh_cmd=$(python3 .github/desktop-ci-command.py "$DESKTOP_CI_SLOT_SECONDS" "$ssh_cmd")

          # Signing secrets travel as one hex line that the desktop-ci preamble
          # skips, so they never enter the build environment. The first build
          # process takes the line out of the VM's dci_env. printf is a shell
          # builtin, so the values stay out of every process argument list.
          signing_line() { printf '#muniment-signing-env:'; printf '%s\n' "$@" | od -An -v -tx1 | tr -d ' \n'; printf '\n'; }
          signing_env=""
          if [ "$PLATFORM" = "windows" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            signing_env=$(signing_line \
              "AZURE_TENANT_ID=$AZURE_TENANT_ID" \
              "AZURE_CLIENT_ID=$AZURE_CLIENT_ID" \
              "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET" \
              "AZURE_SIGNING_ENDPOINT=$AZURE_SIGNING_ENDPOINT" \
              "AZURE_SIGNING_ACCOUNT=$AZURE_SIGNING_ACCOUNT" \
              "AZURE_SIGNING_PROFILE=$AZURE_SIGNING_PROFILE")
          fi
          # The .p12 and .p8 arrive base64-encoded (single-line, so they survive
          # the KEY=VALUE contract); build-macos-app.mjs decodes them after the
          # config flag enables signing.
          if [ "$PLATFORM" = "macos" ] && [ "$MACOS_SIGNING_ENABLED" = "true" ]; then
            signing_env=$(printf '%s\n' "MACOS_SIGNING_ENABLED=$MACOS_SIGNING_ENABLED"; signing_line \
              "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" \
              "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" \
              "APPLE_TEAM_ID=$APPLE_TEAM_ID" \
              "APPLE_API_KEY=$APPLE_API_KEY" \
              "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" \
              "APPLE_API_ISSUER=$APPLE_API_ISSUER")
          fi
          # Compile the candidate into the app and runtime for installed E2E.
          { printf '%s\n' "GH_TOKEN=$REPO_TOKEN" "MUNIMENT_PI_CANDIDATE=1"; if [ -n "$signing_env" ]; then printf '%s\n' "$signing_env"; fi; } \
          | ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
                -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
                desktopci@10.1.10.10 "$ssh_cmd"

      # The updater key stays on the runner in this one step, which runs only
      # this repository's code and Node's crypto, makes no tool download, and
      # checks each signature against src-tauri/updater.pub before upload.
      - name: Sign update bundles (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .github/lib/nightly-release.mjs sign munimentai/muniment "$SOURCE_SHA" "$PLATFORM"

  publish:
    needs: [prepare, build]
    # Skip on a single-platform targeted run — the release asset-set check needs all platforms.
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all'
    runs-on: muniment-checks
    permissions:
      contents: write
    steps:
      - name: Check out release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      # The rolling tag stays at its original commit. The release text names
      # the source SHA and the signing state.
      - name: Finalize rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          WINDOWS_SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED || 'false' }}
        run: node .github/lib/nightly-release.mjs finalize munimentai/muniment "$SOURCE_SHA"

  linux-e2e:
    # Each matrix build uploads its own package. Linux tests its package even
    # when another platform fails. The runner reports a missing Linux package.
    needs: [prepare, build, publish]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux')
    runs-on: self-hosted
    # Allow the slot, guest, collection, cleanup, and upload to finish.
    timeout-minutes: 195
    env:
      DESKTOP_CI_SLOT_SECONDS: 7200
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: munimentai/muniment
      RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      FIXTURE_USERNAME: ${{ secrets.DESKTOP_E2E_USERNAME }}
      FIXTURE_PASSWORD: ${{ secrets.DESKTOP_E2E_PASSWORD }}
      DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
    steps:
      - name: Check out E2E harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Run installed Linux sign-in via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" >"$known_hosts"

          cmd='bash test/e2e/runner/linux.sh'
          remote="sudo desktop-ci linux --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts"
          remote=$(python3 .github/desktop-ci-command.py "$DESKTOP_CI_SLOT_SECONDS" "$remote")
          set +e
          printf '%s\n' \
            "MUNIMENT_PI_CANDIDATE=1" \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
            "MUNIMENT_E2E_USERNAME=$FIXTURE_USERNAME" \
            "MUNIMENT_E2E_PASSWORD=$FIXTURE_PASSWORD" \
          | ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          # Require the contract's one exact, ordered marker pair, strict base64,
          # and a regular-file/directory-only archive before extracting.
          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-e2e-artifacts" "$run_status" || extract_status=$?
          cp "$output" "$RUNNER_TEMP/muniment-e2e-artifacts/desktop-ci-harness.log"
          if (( run_status != 0 || extract_status != 0 )); then
            node test/e2e/support/transcript-tail.mjs "$output"
          fi
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-e2e-artifacts" installed-linux "$run_status" "$extract_status"
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-artifact-store
        if: always()

      - name: Publish diagnostics and JUnit to MinIO
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: bash .github/publish-ci-artifacts.sh linux "$RUNNER_TEMP/muniment-e2e-artifacts"

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  windows-e2e:
    needs: [prepare, linux-e2e]
    # The shared real-auth fixture is exclusive: Windows starts only after the
    # Linux case has completely finished, including its finalizer.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows') &&
      (github.event.inputs.platform == 'windows' || needs.linux-e2e.result != 'skipped')
    runs-on: self-hosted
    # Allow the slot, guest, collection, cleanup, and upload to finish.
    timeout-minutes: 195
    env:
      DESKTOP_CI_SLOT_SECONDS: 7200
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: munimentai/muniment
      RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      FIXTURE_USERNAME: ${{ secrets.DESKTOP_E2E_USERNAME }}
      FIXTURE_PASSWORD: ${{ secrets.DESKTOP_E2E_PASSWORD }}
      DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
    steps:
      - name: Check out E2E harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Run installed Windows sign-in via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" >"$known_hosts"

          cmd='powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/e2e/runner/windows.ps1'
          remote="sudo desktop-ci windows --console-user --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts"
          remote=$(python3 .github/desktop-ci-command.py "$DESKTOP_CI_SLOT_SECONDS" "$remote")
          set +e
          printf '%s\n' \
            "MUNIMENT_PI_CANDIDATE=1" \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
            "MUNIMENT_E2E_USERNAME=$FIXTURE_USERNAME" \
            "MUNIMENT_E2E_PASSWORD=$FIXTURE_PASSWORD" \
          | ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-windows-e2e-artifacts" "$run_status" || extract_status=$?
          cp "$output" "$RUNNER_TEMP/muniment-windows-e2e-artifacts/desktop-ci-harness.log"
          if (( run_status != 0 || extract_status != 0 )); then
            node test/e2e/support/transcript-tail.mjs "$output"
          fi
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-windows-e2e-artifacts" installed-windows "$run_status" "$extract_status"
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-artifact-store
        if: always()

      - name: Publish diagnostics and JUnit to MinIO
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: bash .github/publish-ci-artifacts.sh windows "$RUNNER_TEMP/muniment-windows-e2e-artifacts"

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  macos-e2e:
    needs: [prepare, windows-e2e]
    # pve01 permits one desktop VM at a time. macOS starts only after the
    # Windows case has completely finished, including its finalizer.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos') &&
      (github.event.inputs.platform == 'macos' || needs.windows-e2e.result != 'skipped')
    runs-on: self-hosted
    # Allow the slot, guest, collection, cleanup, and upload to finish.
    timeout-minutes: 195
    env:
      DESKTOP_CI_SLOT_SECONDS: 7200
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      REPOSITORY: munimentai/muniment
      RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      FIXTURE_USERNAME: ${{ secrets.DESKTOP_E2E_USERNAME }}
      FIXTURE_PASSWORD: ${{ secrets.DESKTOP_E2E_PASSWORD }}
      DESKTOP_CI_KNOWN_HOSTS: ${{ vars.DESKTOP_CI_KNOWN_HOSTS }}
    steps:
      - name: Check out E2E harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Validate pinned source identity
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }

      - name: Run macOS release smoke and embedded E2E via desktop-ci
        id: e2e
        run: |
          set -uo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/desktop_ci_key"
          output="$RUNNER_TEMP/desktop_ci_output"
          known_hosts="$RUNNER_TEMP/desktop_ci_known_hosts"
          printf '%s' "$DESKTOP_CI_SSH_KEY" >"$key"
          trap 'rm -f "$key" "$output" "$known_hosts"' EXIT
          printf '%s\n' "${DESKTOP_CI_KNOWN_HOSTS:?set the DESKTOP_CI_KNOWN_HOSTS variable to the desktop-ci host keys}" >"$known_hosts"

          cmd='bash test/e2e/support/macos-keychain-session.sh bash test/e2e/runner/macos.sh >/tmp/muniment-macos-smoke-artifacts && bash test/e2e/support/macos-keychain-session.sh bash test/e2e/runner/macos-wdio.sh'
          remote="sudo desktop-ci macos --repo 'https://github.com/${REPOSITORY}.git' --ref '$SOURCE_SHA' --cmd '$cmd' --env-stdin --memory 8192 --build-timeout 2400 --collect-artifacts --screendump"
          remote=$(python3 .github/desktop-ci-command.py "$DESKTOP_CI_SLOT_SECONDS" "$remote")
          set +e
          printf '%s\n' \
            "MUNIMENT_PI_CANDIDATE=1" \
            "GH_TOKEN=$RELEASE_TOKEN" \
            "GITHUB_REPOSITORY=$REPOSITORY" \
            "MUNIMENT_E2E_SOURCE_SHA=$SOURCE_SHA" \
            "MUNIMENT_E2E_USERNAME=$FIXTURE_USERNAME" \
            "MUNIMENT_E2E_PASSWORD=$FIXTURE_PASSWORD" \
          | ssh -i "$key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              desktopci@10.1.10.10 "$remote" >"$output" 2>&1
          run_status=$?
          set -e

          extract_status=0
          bash test/e2e/support/extract-artifacts.sh "$output" "$RUNNER_TEMP/muniment-macos-e2e-artifacts" "$run_status" || extract_status=$?
          cp "$output" "$RUNNER_TEMP/muniment-macos-e2e-artifacts/desktop-ci-harness.log"
          if (( run_status != 0 || extract_status != 0 )); then
            node test/e2e/support/transcript-tail.mjs "$output"
          fi
          bash test/e2e/support/ensure-junit-report.sh \
            "$RUNNER_TEMP/muniment-macos-e2e-artifacts" installed-macos "$run_status" "$extract_status"
          if (( run_status != 0 || extract_status != 0 )); then final_status=1; else final_status=0; fi
          printf 'status=%s\n' "$final_status" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-artifact-store
        if: always()

      - name: Publish diagnostics and JUnit to MinIO
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_CI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_CI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: bash .github/publish-ci-artifacts.sh macos "$RUNNER_TEMP/muniment-macos-e2e-artifacts"

      - name: Preserve E2E result
        if: always()
        env:
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: test "$E2E_STATUS" = 0

  verify-requested-e2e:
    needs: [linux-e2e, windows-e2e, macos-e2e]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'all'
    runs-on: muniment-checks
    env:
      REQUESTED_PLATFORM: ${{ github.event.inputs.platform }}
      LINUX_RESULT: ${{ needs.linux-e2e.result }}
      WINDOWS_RESULT: ${{ needs.windows-e2e.result }}
      MACOS_RESULT: ${{ needs.macos-e2e.result }}
    steps:
      - name: Reject a skipped requested E2E job
        run: |
          case "$REQUESTED_PLATFORM" in
            linux) result="$LINUX_RESULT" ;;
            windows) result="$WINDOWS_RESULT" ;;
            macos) result="$MACOS_RESULT" ;;
            *) echo "unsupported requested platform: $REQUESTED_PLATFORM" >&2; exit 1 ;;
          esac
          if [ "$result" = "skipped" ]; then
            echo "requested $REQUESTED_PLATFORM E2E job was skipped" >&2
            exit 1
          fi
