name: muniment-core update

# Moves every muniment-core git dependency to the newest release tag and opens
# or refreshes one Forgejo pull request. A pull request or a push from the job
# token starts no workflow, so this dispatches the required checks on the
# branch. The PR merges itself after they pass. A muniment-core change that
# needs desktop code keeps it open. Forgejo runs
# .forgejo/workflows/muniment-core-update.yml, a byte-identical copy of this
# file, and GitHub keeps this workflow disabled.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: muniment-core-update
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  BRANCH: muniment-core-update
  CORE_REPOSITORY: munimentai/muniment-core

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rust toolchain (bootstrap if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            bash .github/bootstrap-rustup.sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Find the newest muniment-core release
        id: release
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs "https://github.com/$CORE_REPOSITORY" 'v*' \
            | awk '{ sub("refs/tags/", "", $2); print $2 }' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          current=$(grep -ohE "git = \"https://github.com/$CORE_REPOSITORY\", tag = \"v[0-9]+\.[0-9]+\.[0-9]+\"" src-tauri/Cargo.toml \
            | head -n 1 | sed -E 's/.*tag = "(v[^"]+)"/\1/')
          test -n "$tag" && test -n "$current"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -n 1)" = "$current" ]; then
            echo "The desktop already depends on muniment-core $current."
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "newer=true" >> "$GITHUB_OUTPUT"
          # The release notes list every commit subject since the previous tag.
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          for release in $(git ls-remote --tags --refs "https://github.com/$CORE_REPOSITORY" 'v*' \
              | awk '{ sub("refs/tags/", "", $2); print $2 }' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V); do
            if [ "$(printf '%s\n%s\n' "$release" "$current" | sort -V | tail -n 1)" = "$release" ] \
                && [ "$release" != "$current" ] \
                && [ "$(printf '%s\n%s\n' "$release" "$tag" | sort -V | tail -n 1)" = "$tag" ]; then
              printf '## %s\n\n' "$release" >> "$notes"
              curl -sSfL --retry 3 "https://api.github.com/repos/$CORE_REPOSITORY/releases/tags/$release" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin).get("body") or "")' >> "$notes"
              printf '\n' >> "$notes"
            fi
          done
          prefix=chore
          if grep -qE '^- fix(\([^)]*\))?!?: |^- perf(\([^)]*\))?!?: ' "$notes"; then
            prefix=fix
          fi
          if grep -qE '^- feat(\([^)]*\))?!?: ' "$notes"; then
            prefix=feat
          fi
          echo "title=$prefix: update muniment-core to $tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Update the dependency and the lockfile
        if: steps.release.outputs.newer == 'true'
        run: scripts/update-muniment-core.sh "${{ steps.release.outputs.tag }}"

      - name: Open or refresh the pull request
        if: steps.release.outputs.newer == 'true'
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.localhost"
          git checkout -B "$BRANCH"
          git add -A -- '*Cargo.toml' '*Cargo.lock' THIRD_PARTY_RUST_NOTICES.md
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          body="$RUNNER_TEMP/body.md"
          {
            printf 'Moves every muniment-core git dependency to `%s` and updates `src-tauri/Cargo.lock` and the Rust notices.\n\n' "$TAG"
            printf 'Release notes since the current tag:\n\n'
            cat "$NOTES"
          } > "$body"
          api() { curl -sSf -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' "$@"; }
          payload=$(python3 -c 'import json, os, sys; print(json.dumps({"title": os.environ["TITLE"], "body": open(sys.argv[1]).read(), "head": os.environ["BRANCH"], "base": "main"}))' "$body")
          number=$(api "$API/pulls?state=open&limit=50" \
            | python3 -c 'import json, os, sys; print(next((str(p["number"]) for p in json.load(sys.stdin) if p["head"]["ref"] == os.environ["BRANCH"] and p["base"]["ref"] == "main"), ""))')
          if [ -n "$number" ]; then
            api -X PATCH -d "$payload" "$API/pulls/$number" >/dev/null
          else
            number=$(api -X POST -d "$payload" "$API/pulls" | python3 -c 'import json, sys; print(json.load(sys.stdin)["number"])')
          fi
          # A push from the job token starts no workflow, so this dispatches the
          # required checks on the branch.
          for workflow in ci.yml secret-scan.yml; do
            api -X POST -d "{\"ref\":\"$BRANCH\"}" "$API/actions/workflows/$workflow/dispatches" >/dev/null \
              || echo "::warning::Could not dispatch $workflow on $BRANCH."
          done
          # Merge once the checks pass, with a merge commit.
          api -X POST -d "{\"Do\":\"merge\",\"merge_when_checks_succeed\":true,\"head_commit_id\":\"$(git rev-parse HEAD)\"}" \
            "$API/pulls/$number/merge" >/dev/null \
            || echo "::warning::Pull request $number waits for a manual merge."
