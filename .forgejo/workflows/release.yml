name: Promote stable desktop release
# Forgejo runs .forgejo/workflows/release.yml, a byte-identical copy of this
# file, and GitHub keeps this workflow disabled. The job token reads the source,
# CI and nightly runs on Forgejo and creates the version tag there. The push
# mirror carries the tag to GitHub, and GH_RELEASE_TOKEN publishes the release
# on munimentai/muniment.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character SHA finalized by the nightly release"
        required: true
        type: string
      version:
        description: "Strict stable version (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      dry_run:
        description: "Run every check and stop before the tag and release are created"
        type: boolean
        default: false
permissions:
  contents: write
  checks: read
  actions: read
concurrency:
  # Share the nightly lock so its tag/assets cannot move between validation
  # and publication; this also serializes stable promotions.
  group: nightly-desktop-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: self-hosted
    steps:
      # Forgejo runners have no job-started hook, so the first step admits only
      # an owner dispatch of main before any later step reads a credential.
      - name: Admit only an owner dispatch of main
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$REPOSITORY" != factory/muniment ] || [ "$EVENT" != workflow_dispatch ] || [ "$REF" != refs/heads/main ] || [ "$ACTOR" != mikeydiamonds ]; then
            echo '::error::Release jobs run only from an owner dispatch of main in factory/muniment.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use the checked workflow's tools while promoting the separately
          # verified source SHA. Tooling fixes do not rebuild release bytes.
          ref: ${{ github.sha }}
      # Promotion checks the signatures in the bytes it publishes. osslsigncode
      # and archive extractors come pinned from the Ubuntu archive; rcodesign is a pinned
      # release checked against the SHA-256 its project publishes.
      - name: Install signature verifiers
        env:
          RCODESIGN_VERSION: 0.29.0
          RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          set -euo pipefail
          sudo=
          [ "$(id -u)" -eq 0 ] || sudo=sudo
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends osslsigncode=2.8-2 unzip=6.0-28ubuntu4.1 p7zip-full=16.02+transitional.1 squashfs-tools=1:4.6.1-1build1
          tools="$RUNNER_TEMP/signature-tools"
          mkdir -p "$tools"
          archive="$tools/rcodesign.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$RCODESIGN_SHA256" "$archive" | sha256sum --check --quiet
          tar -xzf "$archive" -C "$tools" --strip-components=1
          rm -f "$archive"
          echo "$tools" >> "$GITHUB_PATH"
          osslsigncode --version
          7z i >/dev/null
          command -v unsquashfs >/dev/null
          "$tools/rcodesign" --version
      - name: Test compressed AppImage guard
        run: bash test/e2e/support/test-appimage-guard.sh
      - name: Assert WebDriver marker and capability absence from release artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/muniment-release-guard.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          GH_HOST=github.com gh release download nightly --repo munimentai/muniment --pattern "nightly-${SOURCE_SHA}-*" --dir "$work/assets"
          for artifact in "$work"/assets/*; do
            [[ $artifact == *.sig ]] && continue
            bash test/e2e/support/webdriver-artifact-guard.sh absent "$artifact"
          done
          node test/e2e/support/webdriver-capability-guard.mjs
      - name: Verify and promote finalized nightly bytes
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mode=()
          if [ "$DRY_RUN" = true ]; then mode=(--dry-run); fi
          node .github/lib/release-promotion.mjs munimentai/muniment "$SOURCE_SHA" "$VERSION" "${mode[@]}"

  draft-winget-pr:
    name: Draft WinGet manifest PR
    needs: promote
    if: format('{0}', inputs.dry_run) != 'true'
    runs-on: self-hosted
    steps:
      # Forgejo runners have no job-started hook, so the first step admits only
      # an owner dispatch of main before any later step reads a credential.
      - name: Admit only an owner dispatch of main
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$REPOSITORY" != factory/muniment ] || [ "$EVENT" != workflow_dispatch ] || [ "$REF" != refs/heads/main ] || [ "$ACTOR" != mikeydiamonds ]; then
            echo '::error::Release jobs run only from an owner dispatch of main in factory/muniment.' >&2
            exit 1
          fi

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: muniment-desktop
      - name: Check out winget-pkgs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          github-server-url: https://github.com
          repository: microsoft/winget-pkgs
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          path: winget-pkgs
      - name: Generate manifest from the published machine MSI
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: node muniment-desktop/.github/lib/winget-release.mjs munimentai/muniment "$VERSION" winget-pkgs
      # The pull request goes to GitHub, so the action gets GitHub's API URL
      # in place of the Forgejo one the job sees.
      - name: Draft manifest PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        env:
          GITHUB_API_URL: https://api.github.com
          GITHUB_SERVER_URL: https://github.com
        with:
          path: winget-pkgs
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          push-to-fork: mikeydiamonds/winget-pkgs
          branch: winget/muniment-${{ inputs.version }}
          delete-branch: true
          draft: true
          commit-message: "New version: Muniment.Muniment ${{ inputs.version }}"
          title: "New version: Muniment.Muniment ${{ inputs.version }}"
          body: "Automated draft for the signed, per-machine MSI from the Muniment stable release."
