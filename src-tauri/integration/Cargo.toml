[package]
name = "muniment-desktop-integration"
version = "0.0.1"
edition = "2021"

# Desktop-only contracts: cloud sign-in, cloud chat grants and browser control.
# The shared core takes their results through its port-owned values and traits.

[features]
keyring = ["dep:keyring", "dep:security-framework", "muniment-core/keyring"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ed25519-dalek = "3"
fs2 = "0.4"
getrandom = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"], optional = true }
muniment-core = { git = "https://github.com/munimentai/muniment-core", tag = "v1.14.0" }
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hex = "0.4"
quircs = "0.10"
resvg = { version = "0.48", default-features = false }
syn = { version = "3", features = ["full", "visit"] }
# The headless phone of the live relay test.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = { version = "3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }
