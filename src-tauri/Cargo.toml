[package]
name = "muniment-desktop"
default-run = "muniment-desktop"
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
local-runtime = []
cef-smoke = ["local-runtime"]
browser-agent = []
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver", "objc2-app-kit/NSOpenPanel", "objc2-app-kit/NSSavePanel", "objc2-app-kit/NSGraphicsContext"]

[workspace]
members = [".", "core", "attach", "code-diff", "cli", "acp", "runtime"]
resolver = "2"

[build-dependencies]
sha2 = "0.10"
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
cef = { version = "=152.3.0", default-features = false, features = ["sandbox"] }
tiny_http = "0.12"
cpal = "0.16"
libc = "0.2"
muniment-core = { path = "core", features = ["tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
semver = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-window-state = "=2.4.1"
url = "2"
# The shell reads the one state root and the runtime profile on every platform.
muniment-runtime = { path = "runtime" }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
portable-pty = "0.9"
trash = "5.2.9"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSPanel", "NSOpenPanel", "NSSavePanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSError", "NSNotification", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "SMErrors", "objc2", "objc2-foundation", "std"] }

[dev-dependencies]
muniment-core = { path = "core", features = ["keyring"] }
flate2 = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
muniment-attach = { path = "attach", features = ["client"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["test"] }

[[test]]
name = "launcher-panel"
path = "tests/launcher_panel.rs"
harness = false

[[example]]
name = "sidecar-test-stub"
path = "core/src/bin/sidecar-test-stub.rs"
test = false

[profile.release]
strip = true

[[bin]]
name = "muniment-cef-helper"
path = "src/cef_helper.rs"
