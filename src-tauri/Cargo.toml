[package]
name = "muniment-desktop"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
muniment-core = { path = "core", features = ["tls", "native-asr"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs", "proxy-from-env"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Platform keychains: macOS Keychain / Windows Credential Manager / Linux
# Secret Service. `vendored` builds libdbus from source so the Linux build
# VM needs no system packages beyond the C toolchain it already has; the
# other two features are pure windows-sys / Security.framework bindings.
[dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native", "windows-native", "sync-secret-service", "vendored"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
