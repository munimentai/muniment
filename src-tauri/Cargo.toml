[package]
name = "muniment-desktop"
version = "0.0.1"
edition = "2021"

[features]
default = []
local-runtime = []
e2e-webdriver = ["objc2-app-kit/NSOpenPanel", "objc2-app-kit/NSSavePanel", "objc2-app-kit/NSGraphicsContext"]

[workspace]
members = [".", "core", "attach", "code-diff", "cli", "acp", "runtime"]
resolver = "2"

[build-dependencies]
sha2 = "0.10"
tauri-build = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9", features = [] }
cc = "1"

[dependencies]
cpal = "0.16"
libc = "0.2"
muniment-core = { path = "core", features = ["tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
semver = "1"
tauri = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9", features = ["unstable"] }
tauri-runtime-cef = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9", features = ["unstable"] }
tiny_http = "0.12"
tauri-plugin-dialog = { git = "ssh://git@github.com/tauri-apps/plugins-workspace.git", rev = "53b57024e52edbf0f0c4cc7cf8bf695436a49ed8" }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-global-shortcut = { git = "ssh://git@github.com/tauri-apps/plugins-workspace.git", rev = "53b57024e52edbf0f0c4cc7cf8bf695436a49ed8" }
tauri-plugin-opener = { git = "ssh://git@github.com/tauri-apps/plugins-workspace.git", rev = "53b57024e52edbf0f0c4cc7cf8bf695436a49ed8" }
tauri-plugin-window-state = { git = "ssh://git@github.com/tauri-apps/plugins-workspace.git", rev = "53b57024e52edbf0f0c4cc7cf8bf695436a49ed8" }
url = "2"
# The shell reads the one state root and the runtime profile on every platform.
muniment-runtime = { path = "runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSError", "NSNotification", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "SMErrors", "objc2", "objc2-foundation", "std"] }

[dev-dependencies]
muniment-core = { path = "core", features = ["keyring"] }
base64 = "0.22"
flate2 = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
muniment-attach = { path = "attach", features = ["client"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tauri = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9", features = ["test", "unstable"] }

[[test]]
name = "launcher-panel"
path = "tests/launcher_panel.rs"
harness = false

[[example]]
name = "sidecar-test-stub"
path = "core/src/bin/sidecar-test-stub.rs"
test = false

[profile.release]
strip = true

[patch.crates-io]
tauri = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-build = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-codegen = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-macros = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-plugin = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-utils = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
tauri-runtime = { git = "ssh://git@github.com/tauri-apps/tauri.git", rev = "747a0612d5dba9829fb3487a3ed6cdf7b5e81dd9" }
