[package]
name = "muniment-desktop"
version = "0.0.1"
edition = "2021"

[features]
default = []
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[workspace]
members = [".", "core", "attach", "cli", "acp", "runtime"]
resolver = "2"

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.16"
libc = "0.2"
muniment-core = { path = "core", features = ["keyring", "tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
muniment-attach = { path = "attach", features = ["client"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["test"] }

[[example]]
name = "sidecar-test-stub"
path = "core/src/bin/sidecar-test-stub.rs"
test = false

[profile.release]
strip = true
