[package]
name = "muniment-acp"
version = "0.0.1"
edition = "2021"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
muniment-attach = { path = "../attach", default-features = false, features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
