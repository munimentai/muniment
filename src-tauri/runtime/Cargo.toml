[package]
name = "muniment-runtime"
version = "0.0.1"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
muniment-attach = { path = "../attach", features = ["client"] }
muniment-core = { path = "../core", features = ["keyring", "tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
