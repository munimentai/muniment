[package]
name = "muniment-runtime"
version = "0.0.1"
edition = "2021"

[dependencies]
muniment-attach = { path = "../attach", features = ["client"] }
muniment-core = { path = "../core", features = ["keyring", "tls"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde_json = "1"
