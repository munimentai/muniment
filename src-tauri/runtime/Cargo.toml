[package]
name = "muniment-runtime"
version = "0.0.1"
edition = "2021"

[dependencies]
muniment-attach = { path = "../attach", features = ["client"] }
muniment-core = { path = "../core", features = ["keyring"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }
