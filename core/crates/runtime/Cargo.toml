[package]
name = "muniment-runtime-core"
version.workspace = true
edition = "2021"

# The platform-neutral runtime: attach serving, runs, schedules, the company
# record service, the model service with its router, and the web search
# server. The host binary supplies cloud accounts, chat grants, credential
# storage, provider OAuth clients and its own executables through
# `RuntimeHost`, and registers the binary with the OS service manager.

[features]
default = ["keyring"]
# The platform keychain: `KeyringCredentialStore`, the default credential
# store, and prompt history outside local mode. A host without a keychain
# turns it off, and prompts and credentials then live in files under the
# state root.
keyring = ["muniment-core/keyring", "dep:security-framework"]

[dependencies]
muniment-attach = { path = "../attach", features = ["client"] }
muniment-core = { path = "../core" }
muniment-search = { path = "../search" }
serde = { version = "1", features = ["derive"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

# The keychain's status codes, so a declined prompt reads as a refusal and
# not as a missing secret. The keyring's own macOS backend uses this crate.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[dev-dependencies]
# Marks the core as a test build, so no test writes the owner's runtime logs.
muniment-core = { path = "../core", features = ["test-build"] }
# The fleet tests read blob chunks the way the phone does.
base64 = "0.23"
# The journal tests drop tables to build missing-table fixtures.
rusqlite = { version = "0.40", features = ["bundled"] }
