[extend]
useDefault = true

# Only the low-confidence entropy rule is relaxed inside test paths. Every
# prefixed provider rule (github-pat, openai, anthropic, slack, stripe,
# huggingface, aws-access-token, ...) stays active everywhere, tests included.
# KNOWN GAP: a prefix-less high-entropy secret (an AWS secret access key, a
# raw password) committed under a test path is not detected.
[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
entropy = 3.5
keywords = ["key","api","token","secret","client","passwd","password","auth","access"]
  [[rules.allowlists]]
  paths = [
    '''(^|/)(test|tests|__tests__|spec)/''',
    '''\.(test|spec)\.[jt]sx?$''',
    '''_test\.go$''',
  ]

# JWTs are relaxed in fixture directories only, not across all test code.
[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '''\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.(?:[a-zA-Z0-9\/\\_-]{10,}={0,2})?)(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["ey"]
  [[rules.allowlists]]
  paths = ['''(^|/)fixtures/''']

# One named fixture, not a directory. A new private key anywhere else blocks.
[[rules]]
id = "private-key"
description = "Private Key"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-----[\s\S-]*?KEY( BLOCK)?----'''
keywords = ["-----begin"]
  [[rules.allowlists]]
  paths = ['''^test/fixtures/provider-egress-key\.pem$''']
