[extend]
useDefault = true

# Attach allowlists to the pinned default rules. Never re-declare regex,
# entropy or keywords: a re-declared rule id REPLACES the default rule and
# freezes it at the copied version.
# KNOWN GAP, accepted: a prefix-less high-entropy secret under a test path is
# not detected. Every prefixed provider rule stays active everywhere.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  paths = [
    '''(^|/)(test|tests|__tests__|spec)/''',
    '''\.(test|spec)\.[jt]sx?$''',
    '''_test\.go$''',
    '''_tests\.rs$''',
  ]
  # An uppercase environment name assigned a value is a variable, not a
  # credential. A real credential's captured secret carries no NAME= prefix.
  [[rules.allowlists]]
  regexes = ['''^[A-Z][A-Z0-9_]{2,}=[A-Za-z0-9_.\-]*$''']
  # The relay encryption conformance vectors hold synthetic test keys.
  # The browser control tests send the RFC 6455 sample WebSocket key.
  [[rules.allowlists]]
  paths = [
    '''^core/protocol-fixtures/muniment\.relay-encryption/1/relay-encryption-v1\.json$''',
    '''^src-tauri/core/src/browser_control/linux_transport\.rs$''',
  ]
  # The attach protocol fixtures and their generator carry synthetic rewind
  # tokens.
  [[rules.allowlists]]
  paths = [
    '''^core/protocol-fixtures/muniment\.attach/1/''',
    '''^core/crates/attach/src/fixtures\.rs$''',
  ]

[[rules]]
id = "jwt"
  [[rules.allowlists]]
  paths = ['''(^|/)fixtures/''']

[[rules]]
id = "private-key"
  [[rules.allowlists]]
  paths = [
    '''^test/fixtures/provider-egress-key\.pem$''',
    # Secret scanner tests build PEM blocks with placeholder bodies.
    '''^src-tauri/core/tests/assistant_text_secrets\.rs$''',
  ]
