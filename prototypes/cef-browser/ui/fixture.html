<!doctype html><html lang="en"><meta charset="utf-8"><title>Workspace · Browser test</title><style>body{font:16px/1.5 system-ui;background:#f4f4ef;color:#233b30;max-width:680px;margin:60px auto;padding:25px}h1{font-size:40px;letter-spacing:-1.5px}button,input{font:inherit;padding:10px 16px;border:1px solid #a4b7a8;border-radius:6px}button{background:#234d3a;color:white;cursor:pointer}section{background:white;padding:28px;border:1px solid #d1dad2;border-radius:12px;margin:22px 0}.tag{font-size:12px;text-transform:uppercase;letter-spacing:2px}label{display:block;margin-bottom:8px}p{color:#57695f}#session{font-weight:600;color:#234d3a}</style>
<div class="tag">Muniment / Test workspace</div><h1>A browser you can<br>work in together.</h1><p>This local workspace tests shared controls and saved sessions.</p><section><label for="name">Your name</label><input id="name" placeholder="Enter a test name"><button id="save">Save session</button><p id="session"></p><p id="cookie"></p><p id="session-cookie"></p></section><section><button id="count">Add a task</button><p id="tasks">0 tasks</p><button id="popup">Open sign-in test</button><p id="popup-result">No sign-in test yet.</p></section><section><button id="check-access">Check app access</button><p id="access-result">App access has not been tested.</p></section><p><a href="https://example.org">Open an ordinary website</a></p>
<script>const el=id=>document.getElementById(id);let count=0;const show=()=>{el('session').textContent=localStorage.getItem('name')?'Session saved for '+localStorage.getItem('name'):'No saved session';el('cookie').textContent=document.cookie.includes('prototype_session=saved')?'Session cookie restored':'No session cookie';el('session-cookie').textContent=document.cookie.includes('prototype_transient=saved')?'Session-only cookie restored':'No session-only cookie'};show();el('save').onclick=()=>{localStorage.setItem('name',el('name').value);document.cookie='prototype_session=saved; Max-Age=86400; SameSite=Lax; Path=/';document.cookie='prototype_transient=saved; SameSite=Lax; Path=/';show()};el('count').onclick=()=>el('tasks').textContent=++count+' tasks';el('popup').onclick=()=>window.open('/popup','signin','width=500,height=420');el('check-access').onclick=async()=>{try{if(!window.__TAURI__?.core?.invoke)throw Error('No application bridge');await window.__TAURI__.core.invoke('browser_command',{request:{view:'browser',action:'status',value:'',selector:''}});el('access-result').textContent='App access isolation failed'}catch{el('access-result').textContent='App commands blocked from this page'}};addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='signed-in')el('popup-result').textContent='Sign-in popup returned successfully.'});</script></html>
