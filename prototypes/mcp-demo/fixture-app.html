<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Workshop quote</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #fff; color: #1a1d1c; font: 15px/1.55 system-ui, sans-serif; }
  h3 { margin: 0 0 4px; font-size: 17px; }
  p { margin: 0 0 20px; color: #5c6461; }
  output { display: block; margin: 16px 0; font: 32px/1.3 ui-monospace, monospace; }
  label { display: grid; gap: 6px; }
  input, button { font: inherit; border-radius: 6px; border: 1px solid #e2e5e3; padding: 8px 12px; }
  input { width: 100%; }
  button { background: #edefee; color: #1a1d1c; cursor: pointer; }
  button:hover, button:focus-visible { background: #e2e5e3; }
  button:disabled { opacity: .5; cursor: default; }
  [role=status] { margin: 12px 0 0; }
</style></head><body>
<h3>Workshop quote</h3><p>This disposable tool does not place an order.</p>
<label>Seats<input type="number" min="1" max="20" step="1" value="3"></label>
<output aria-label="Total">$75</output><button type="button">Update quote</button>
<p role="status">The app awaits the tool result.</p>
<script>/* APP_SCRIPT */</script>
</body></html>
